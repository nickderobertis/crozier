openapi: 3.1.0
info:
  title: Orchard Ledger
  version: 1.0.0
paths:
  /harvests:
    get:
      operationId: listHarvests
      parameters:
        - name: season
          in: query
          required: true
          schema:
            type: [string, 'null']
            examples: [null]
      responses:
        '200':
          description: The harvests of a season.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
    post:
      operationId: logHarvest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [picked_on, graders, bin, variety, storage, grade, seal, labels, ripeness, remark]
              properties:
                crate_count:
                  type: integer
                  example: 12.5
                picked_on:
                  type: array
                  items:
                    type: string
                    format: date
                  example: ['2024-09-02', '2024-09-02', '2024-09-03']
                graders:
                  type: array
                  items:
                    type: string
                  example: [ana, null]
                bin:
                  $ref: '#/components/schemas/Bin'
                  example:
                    row: 4
                    shelf: B
                variety:
                  $ref: '#/components/schemas/Variety'
                  example: russet
                storage:
                  $ref: '#/components/schemas/Storage'
                  example:
                    room: cold-2
                grade:
                  oneOf:
                    - type: array
                      items:
                        type: string
                    - type: string
                  example:
                    $ref: '#/components/examples/GradeSample'
                seal:
                  $ref: '#/components/schemas/Seal'
                  example: {}
                labels:
                  oneOf:
                    - type: integer
                    - type: object
                      additionalProperties:
                        type: string
                  example:
                    origin: north-slope
                ripeness:
                  oneOf:
                    - $ref: '#/components/schemas/Variety'
                    - type: string
                  example: overripe
                remark:
                  type: [string, 'null']
                  examples: [null]
      responses:
        '204':
          description: Logged.
  /crates:
    put:
      operationId: stackCrate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrateTag'
            example:
              labels:
                origin: north-slope
              ripeness: overripe
              seal: {}
      responses:
        '204':
          description: Stacked.
  /scans:
    get:
      operationId: 3dScan
      responses:
        '200':
          description: The latest scan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  depth:
                    type: number
components:
  examples:
    GradeSample:
      value: [prime]
  schemas:
    Bin:
      type: object
      required: [row, shelf]
      properties:
        row:
          type: integer
        shelf:
          type: string
    Variety:
      type: string
      enum: [russet, gala, pippin]
    Storage:
      oneOf:
        - type: object
          required: [room]
          properties:
            room:
              type: string
        - type: string
    Seal:
      type: object
      properties: {}
    CrateTag:
      type: object
      required: [labels, ripeness, seal]
      properties:
        labels:
          oneOf:
            - type: integer
            - type: object
              additionalProperties:
                type: string
        ripeness:
          oneOf:
            - $ref: '#/components/schemas/Variety'
            - type: string
        seal:
          $ref: '#/components/schemas/Seal'
