openapi: 3.0.3
info:
  title: Parcel Lockers
  version: 1.3.0
paths:
  /lockers/{locker_id}/reservations:
    post:
      operationId: reserve_locker
      parameters:
        - name: locker_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Reserved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '429 (peak hours)':
          description: Too many reservations during peak hours
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryAdvice'
        '410gone':
          description: The locker was decommissioned
        4xx:
          description: Any other client error
  /lockers/{locker_id}/door:
    post:
      operationId: open_locker_door
      parameters:
        - name: locker_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Door opened
          content:
            application/json:
              schema:
                type: string
        '423':
          description: The door is locked by an attendant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        '423 (tamper lock)':
          description: The door is locked after a tamper alarm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TamperAlarm'
        '503 (firmware update)':
          description: The locker is updating its firmware
        5xx:
          description: Any other locker fault
components:
  schemas:
    Reservation:
      type: object
      properties:
        code:
          type: string
    RetryAdvice:
      type: object
      properties:
        retry_after_seconds:
          type: integer
    Hold:
      type: object
      properties:
        attendant:
          type: string
    TamperAlarm:
      type: object
      properties:
        raised_at:
          type: string
