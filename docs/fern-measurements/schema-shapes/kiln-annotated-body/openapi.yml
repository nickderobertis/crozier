{
  "openapi": "3.1.0",
  "info": {
    "title": "Kiln Controller",
    "version": "1.0.0"
  },
  "paths": {
    "/schedule": {
      "post": {
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "allOf": [
                  {
                    "$ref": "#/components/schemas/Schedule"
                  }
                ],
                "title": "Params",
                "description": "Firing schedule"
              }
            }
          }
        },
        "responses": {
          "204": {
            "description": "Accepted"
          }
        },
        "operationId": "createSchedule"
      }
    },
    "/default": {
      "post": {
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "allOf": [
                  {
                    "$ref": "#/components/schemas/Schedule"
                  }
                ],
                "default": {
                  "peak": 1200
                }
              }
            }
          }
        },
        "responses": {
          "204": {
            "description": "Accepted"
          }
        },
        "operationId": "defaultSchedule"
      }
    },
    "/flattened": {
      "post": {
        "operationId": "createFlatSchedule",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "allOf": [
                  {
                    "$ref": "#/components/schemas/FlatSchedule"
                  }
                ],
                "title": "Params",
                "description": "Flattened schedule"
              }
            }
          }
        },
        "responses": {
          "204": {
            "description": "Accepted"
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "Schedule": {
        "type": "object",
        "properties": {
          "peak": {
            "type": "integer"
          },
          "cooling": {
            "type": "string",
            "enum": [
              "slow",
              "fast"
            ]
          }
        },
        "required": [
          "peak"
        ],
        "title": "Schedule"
      },
      "FlatSchedule": {
        "type": "object",
        "properties": {
          "peak": {
            "type": "integer"
          },
          "hold": {
            "type": "integer"
          }
        },
        "required": [
          "peak"
        ]
      }
    },
    "responses": {}
  }
}
