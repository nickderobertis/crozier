openapi: 3.1.0
info: {title: probe, version: 1.0.0}
paths:
  /cookie:
    post:
      operationId: cookie
      tags: [api]
      parameters:
        - {name: f, in: cookie, schema: {type: string, enum: [a, b]}}
      responses:
        "204":
          description: No Content
  /query:
    post:
      operationId: query
      tags: [api]
      parameters:
        - {name: f, in: query, schema: {type: array, items: {type: string}}}
        - {name: g, in: query, schema: {type: integer}}
      responses:
        "204":
          description: No Content
  /body:
    post:
      operationId: body
      tags: [api]
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Thing"}
      responses:
        "204":
          description: No Content
  /inline:
    post:
      operationId: inline
      tags: [api]
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {a: {type: string}, b: {type: array, items: {type: integer}}}}
      responses:
        "204":
          description: No Content
  /statuses:
    post:
      operationId: statuses
      tags: [api]
      responses:
        "204":
          description: No Content
        "302":
          description: R
        "427":
          description: R
        "432":
          description: R
        "460":
          description: R
        "520":
          description: R
        "599":
          description: R
        "4XX":
          description: R
        "default":
          description: R
  /string:
    post:
      operationId: string
      tags: [api]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: string}
  /strings:
    post:
      operationId: strings
      tags: [api]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: array, items: {type: string}}
  /map:
    post:
      operationId: map
      tags: [api]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: object, additionalProperties: {type: string}}
  /nullable:
    post:
      operationId: nullable
      tags: [api]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {anyOf: [{type: string}, {type: 'null'}]}
  /object:
    post:
      operationId: object
      tags: [api]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: object}
  /text:
    post:
      operationId: text
      tags: [api]
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema: {$ref: "#/components/schemas/Color"}
  /second:
    post:
      operationId: second
      tags: [api]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: string}
        "202":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Thing"}
  /ignored:
    post:
      operationId: ignored
      tags: [api]
      x-fern-ignore: true
      responses:
        "403":
          description: Forbidden
components:
  schemas:
    Thing:
      type: object
      properties:
        id: {type: string}
    Color: {type: string, enum: [red, blue]}
