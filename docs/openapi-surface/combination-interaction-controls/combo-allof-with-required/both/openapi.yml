        "type": "object",
        "properties": {
          "name": {
            "type": "string"
          }
        }
      },
      "Tally": {
        "required": [
          "name"
        ],
        "allOf": [
          {
            "$ref": "#/components/schemas/Kennel"
          },
          {
            "type": "object",
            "properties": {
              "count": {
                "type": "integer"
              }
            }
          }
        ]
      }
    }
  }
