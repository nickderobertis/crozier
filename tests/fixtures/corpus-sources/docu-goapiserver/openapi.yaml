            documented company/session scope.
          schema:
            type: string
            format: uuid
          example: 22222222-2222-4222-8222-222222222222
        - name: view
          in: query
          required: false
          description: Omit for the full report; students selects paginated detail.
          schema:
            type: string
            enum:
              - students
