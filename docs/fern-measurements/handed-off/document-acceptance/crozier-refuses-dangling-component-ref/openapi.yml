openapi: 3.0.0
info:
  title: Checkout payments
  version: 1.0.0
paths:
  /payments:
    post:
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInput'
      responses:
        '200':
          description: The payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '403':
          $ref: '#/components/schemas/payment_error'
components:
  schemas:
    PaymentInput:
      type: object
      required:
        - amount
      properties:
        amount:
          type: integer
    Payment:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
    payment_error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
