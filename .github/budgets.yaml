schema_version: 1
budgets:
  - id: crozier-macos-jobs-per-run
    description: >-
      Maximum resolved Mac runner instances per workflow run over 12 event
      classes, three diffs, same-repository/fork ownership and every registry
      publish combination, including opted-in diagnostics. Measurement uses
      workflow/call-graph telemetry only. Manager-approved separate scheduling
      constraints: the brief requires both jobs/run and Mac-spending runs/change.
      inner_measure_reason: one run can occupy several shared Mac slots even
      when the lifecycle run count stays within its bound.
    measure: reported
    command: [node, macos-budget.mjs, --metric, jobs-per-run, --telemetry, .telemetry/macos-policy.json]
    unit: jobs
    direction: max
    threshold: 1
    timeout_seconds: 10
  - id: crozier-macos-runs-per-change
    description: >-
      Maximum Mac-spending workflow runs over one PR push, its base merge,
      version/changelog-only release PR and merge, release/tag build and all
      downstream automatic events. Manual diagnostics are excluded. Measurement
      uses workflow/call-graph telemetry only. Manager-approved separate scheduling
      constraints: the brief requires both jobs/run and Mac-spending runs/change.
    measure: reported
    command: [node, macos-budget.mjs, --metric, runs-per-change, --telemetry, .telemetry/macos-policy.json]
    unit: runs
    direction: max
    threshold: 2
    timeout_seconds: 10
  - id: crozier-fern-goldens-weekly-minutes
    description: >-
      Maximum wall-clock minutes from the weekly Fern goldens run's start to its
      pull request, on either path, as the workflow's own shard planner
      (tools/fern-goldens/weekly.py plan) predicts them over the finished tree's
      whole reference inventory: per-item seconds from
      tools/fern-goldens/generation-seconds.tsv, the planned shards scheduled on
      GitHub's 20-concurrent-job allowance for a free-plan public repository, plus
      each job's setup and the assembly, decision and publication jobs. Measurement
      uses the plan telemetry the github-workflows test records only.
      inner_measure_reason: the real run happens only weekly on GitHub, so the gate
      measures the plan that run executes, from per-item times earlier real runs
      recorded. Basis: estimate (run 38208782203's corpus rate, applied to the
      families no run has timed yet).
    measure: reported
    command: [node, fern-goldens-budget.mjs, --telemetry, .telemetry/fern-goldens-plan.json]
    unit: minutes
    direction: max
    threshold: 180
    timeout_seconds: 10
