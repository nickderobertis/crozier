        "operationId": "create",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "sensors": {
                    "type": "array",
                    "items": {
                      "oneOf": [
                        {
                          "type": "object",
                          "title": "Fixed Sensor",
                          "x-fern-type-name": "Fixed Sensor",
                          "properties": {
                            "station": {
                              "type": "string"
                            }
                          }
                        },
                        {
                          "type": "object",
                          "title": "Mobile Sensor",
                          "x-fern-type-name": "Mobile Sensor",
                          "properties": {
                            "route": {
                              "type": "string"
                            }
