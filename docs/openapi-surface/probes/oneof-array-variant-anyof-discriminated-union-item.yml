openapi: 3.1.0
info:
  title: oneof-array-variant-anyof-discriminated-union-item probe
  version: 1.0.0
paths:
  /probe:
    get:
      operationId: getProbe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Probe"
components:
  schemas:
    Probe:
      oneOf:
        - type: array
          items:
            discriminator:
              propertyName: kind
            anyOf:
              - $ref: "#/components/schemas/A"
              - $ref: "#/components/schemas/B"
        - type: integer
    A:
      type: object
      properties:
        kind: { type: string }
    B:
      type: object
      properties:
        kind: { type: string }

