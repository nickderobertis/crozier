      summary: List payrolls
      description: Requires a school assigned to the session. period selects one pay-period end date;
        period_from and period_to select a range. period cannot be combined with either range bound, and
        period_to cannot precede period_from. Returns an unpaginated array without collection metadata
        headers. Omitting selectors reads the available payroll records for the school.
      operationId: GetGustoPayrollsV3
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - name: school_id
          in: query
          required: true
          description: School UUID. Must be assigned to the authenticated session.
          schema:
            type: string
            format: uuid
          example: 22222222-2222-4222-8222-222222222222
        - name: period
          in: query
          required: false
          description: Exact pay-period end date; mutually exclusive with range bounds.
          schema:
            type: string
            format: date
        - name: period_from
          in: query
          required: false
          description: Earliest pay-period end date, inclusive.
          schema:
            type: string
            format: date
        - name: period_to
          in: query
          required: false
          description: Latest pay-period end date, inclusive.
