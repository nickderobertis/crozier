components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by POST /sessions and associated with a valid server-side session.
  parameters:
    CompanyId:
      name: company_id
      in: query
      required: true
      description: Company UUID. Must equal the authenticated session company when that session has a
        company assigned; the equality check is skipped for sessions without one.
      schema:
        type: string
        format: uuid
      example: 11111111-1111-4111-8111-111111111111
  headers:
    TotalCount:
      description: Total matching rows before pagination, or matching groups before the aggregate limit.
        For unpaginated arrays, the number of returned rows.
      schema:
        type: integer
        minimum: 0
      example: 125
    Link:
      description: Pagination links using rel="next", "last", "prev", and "first". Only applicable links
        are sent; absent when all results fit on one page. Links preserve the original query parameters.
      schema:
        type: string
      example: </primula/api/v3/students?company_id=11111111-1111-4111-8111-111111111111&page=2>; rel="next"
    Truncated:
      description: Present with value true only when an aggregate result exceeds its limit.
      schema:
        type: boolean
      example: true
    HasAlerts:
      description: Present with value true when the underlying collection reports alerts. Computed for
        the collection before pagination; absent otherwise.
      schema:
        type: boolean
      example: true
    RoomFilterCount:
      description: Number of room IDs in the resolved filter; omitted when zero.
      schema:
        type: integer
        minimum: 1
    StudentFilterCount:
      description: Number of student IDs in the resolved filter; omitted when zero.
      schema:
        type: integer
        minimum: 1
  responses:
    '400':
      description: Invalid or missing parameters or request body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Invalid or missing parameters or request body.
    '403':
      description: The authenticated session is not allowed to perform this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: The authenticated session is not allowed to perform this operation.
    '404':
      description: The requested resource was not found in the requested scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: The requested resource was not found in the requested scope.
    '405':
      description: The path exists but does not support this HTTP method.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: The path exists but does not support this HTTP method.
      headers:
        Allow:
          description: Comma-separated HTTP methods accepted by this path.
          schema:
            type: string
    '415':
      description: The request Content-Type must be application/json; charset parameters are accepted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: The request Content-Type must be application/json; charset parameters are accepted.
    '500':
      description: The operation could not be completed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: The operation could not be completed.
    '502':
      description: The upstream service could not be reached or returned an unexpected response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: The upstream service could not be reached or returned an unexpected response.
    '401':
      description: Missing or invalid Bearer token, or an absent, invalid or expired server-side session.
        The authentication middleware returns plain text with a trailing newline.
      content:
        text/plain:
          schema:
            type: string
          examples:
            missing:
              value: |
                missing authorization header
            invalid:
              value: |
                Unauthorized
            expired:
              value: |
                Session expired
    Plain400:
      description: Invalid or missing parameters or request body.
      content:
        text/plain:
          schema:
            type: string
    Plain500:
      description: The operation could not be completed.
      content:
        text/plain:
          schema:
            type: string
    Plain502:
      description: The upstream service could not be reached or returned an unexpected response.
      content:
        text/plain:
          schema:
            type: string
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message.
      required:
        - error
      description: Error.
    CreateSessionRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          writeOnly: true
      required:
        - username
        - password
      additionalProperties: false
      description: Create Session Request.
    Session:
