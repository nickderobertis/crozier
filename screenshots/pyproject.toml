# The `screenshots` Nx project's uv workspace member (the workspace is declared in
# the root pyproject.toml). It publishes nothing: there is no [build-system],
# and `package = false` keeps uv from trying to build or install it.
[project]
name = "crozier-screenshots"
version = "0.0.0"
description = "The README's animated demo renderer (demo-gif.py)."
requires-python = ">=3.11"
dependencies = ["Pillow>=11"]

[tool.uv]
package = false
