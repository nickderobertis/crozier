# The `corpus-fetch` Nx project's uv workspace member (the workspace is declared in
# the root pyproject.toml). It publishes nothing: there is no [build-system],
# and `package = false` keeps uv from trying to build or install it.
[project]
name = "crozier-corpus-fetch"
version = "0.0.0"
description = "Suites that drive the corpus fetch through real curl against loopback servers."
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false
