openapi: 3.0.3
info:
  title: probe
  version: 1.0.0
paths:
  /pets:
    get:
      operationId: getPet
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [l0]
                properties:
                  l0:
                    type: object
                    required: [l1]
                    properties:
                      l1:
                        type: object
                        required: [l2]
                        properties:
                          l2:
                            type: object
                            required: [l3]
                            properties:
                              l3:
                                type: object
                                required: [l4]
                                properties:
                                  l4:
                                    type: object
                                    required: [l5]
                                    properties:
                                      l5:
                                        type: object
                                        required: [l6]
                                        properties:
                                          l6:
                                            type: object
                                            required: [l7]
                                            properties:
                                              l7:
                                                type: object
                                                required: [l8]
                                                properties:
                                                  l8:
                                                    type: object
                                                    required: [l9]
                                                    properties:
                                                      l9:
                                                        type: object
                                                        required: [l10]
                                                        properties:
                                                          l10:
                                                            type: object
                                                            required: [pet]
                                                            properties:
                                                              pet:
                                                                $ref: "#/components/schemas/Pet"
components:
  schemas:
    Pet:
      oneOf:
        - $ref: "#/components/schemas/Cat"
        - $ref: "#/components/schemas/Dog"
      discriminator:
        propertyName: kind
        mapping:
          cat: "#/components/schemas/Kitten"
          dog: "#/components/schemas/Puppy"
    Cat:
      type: object
      properties:
        kind:
          type: string
        name:
          type: string
    Dog:
      type: object
      properties:
        kind:
          type: string
        name:
          type: string
