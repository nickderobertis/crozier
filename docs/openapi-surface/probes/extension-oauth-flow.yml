openapi: 3.1.0
info:
  title: Probe API
  version: 1.0.0
servers:
- url: https://probe.invalid
paths:
  /probe:
    get:
      operationId: probe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeResult'
      security:
      - OAuth: []
components:
  schemas:
    ProbeResult:
      type: object
      properties:
        ok:
          type: boolean
  securitySchemes:
    OAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://probe.invalid/token
          scopes: {}
          x-proof-marker: ignored-extension
