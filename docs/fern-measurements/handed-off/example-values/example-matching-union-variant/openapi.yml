openapi: 3.1.0
info:
  title: Logbook seals
  version: 1.0.0
paths:
  /seals/verify:
    post:
      operationId: verifySeal
      tags: [seals]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seal]
              properties:
                seal:
                  oneOf:
                    - $ref: "#/components/schemas/WaxSeal"
                    - $ref: "#/components/schemas/StampSeal"
            example:
              seal:
                format: stamp
                stamp_id: st-0091
                inked: true
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
  /logbooks/verify:
    post:
      operationId: verifyLogbook
      tags: [seals]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entry]
              properties:
                entry:
                  oneOf:
                    - $ref: "#/components/schemas/EntryV1"
                    - $ref: "#/components/schemas/EntryV2"
            example:
              entry:
                page:
                  edition: "2.0"
                  keeper: Morwenna
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
  /shelves/stock:
    post:
      operationId: stockShelf
      tags: [seals]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shelf]
              properties:
                shelf:
                  type: object
                  additionalProperties:
                    oneOf:
                      - $ref: "#/components/schemas/WaxSeal"
                      - $ref: "#/components/schemas/StampSeal"
            example:
              shelf:
                top:
                  format: stamp
                  stamp_id: st-0102
                  inked: true
      responses:
        "200":
          description: Stocked
  /badges/verify:
    post:
      operationId: verifyBadge
      tags: [seals]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [badge]
              properties:
                badge:
                  oneOf:
                    - $ref: "#/components/schemas/TinBadge"
                    - $ref: "#/components/schemas/CopperBadge"
            example:
              badge:
                kind: copper
                serial: cu-0007
      responses:
        "200":
          description: Verified
  /seals/register:
    post:
      operationId: registerSeal
      tags: [seals]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SealRegistration"
            examples:
              Stamped:
                summary: A stamped seal
                value:
                  seal:
                    format: stamp
                    stamp_id: st-0203
      responses:
        "200":
          description: Registered
  /charms/verify:
    post:
      operationId: verifyCharm
      tags: [seals]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  oneOf:
                    - $ref: "#/components/schemas/WaxSeal"
                    - $ref: "#/components/schemas/CharmSeal"
            example:
              token:
                format: charm
                charm: 5
                motto: Fortune
      responses:
        "200":
          description: Verified
  /charms/inspect:
    post:
      operationId: inspectCharm
      tags: [seals]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  oneOf:
                    - $ref: "#/components/schemas/WaxSeal"
                    - $ref: "#/components/schemas/CharmSeal"
            example:
              token:
                format: charm
                motto: Plenty
      responses:
        "200":
          description: Inspected
components:
  schemas:
    WaxSeal:
      type: object
      required: [format, colour]
      properties:
        format:
          type: string
          enum: [wax]
        colour:
          type: string
    StampSeal:
      type: object
      required: [format, stamp_id]
      properties:
        format:
          type: string
          enum: [stamp]
        stamp_id:
          type: string
        inked:
          type: boolean
    EntryV1:
      type: object
      required: [page]
      properties:
        page:
          $ref: "#/components/schemas/PageV1"
    EntryV2:
      type: object
      required: [page]
      properties:
        page:
          $ref: "#/components/schemas/PageV2"
    PageV1:
      type: object
      required: [scribe]
      properties:
        scribe:
          type: string
    PageV2:
      type: object
      required: [edition, keeper]
      properties:
        edition:
          type: string
          enum: ["2.0"]
        keeper:
          type: string
    TinBadge:
      type: object
      required: [kind, serial]
      properties:
        kind:
          $ref: "#/components/schemas/TinKind"
        serial:
          type: string
    CopperBadge:
      type: object
      required: [kind, serial]
      properties:
        kind:
          $ref: "#/components/schemas/CopperKind"
        serial:
          type: string
    TinKind:
      type: string
      enum: [tin]
    CopperKind:
      type: string
      enum: [copper]
    SealRegistration:
      type: object
      required: [seal]
      properties:
        seal:
          oneOf:
            - $ref: "#/components/schemas/WaxSeal"
            - $ref: "#/components/schemas/StampSeal"
    CharmSeal:
      type: object
      required: [format, charm, motto]
      properties:
        format:
          type: string
          enum: [charm]
        charm: {}
        motto:
          type: string
