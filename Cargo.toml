# The root is both the `crozier` package and the Cargo workspace, not a virtual
# manifest; src/AGENTS.md says why.
[workspace]
members = [".", "crates/crozier-e2e", "tools/ci", "tools/ci-journeys", "tools/github-action"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/nickderobertis/crozier"

# Shared by the crate's own tests and the test-only members; one lock resolves
# them all.
[workspace.dependencies]
crozier = { path = "." }
assert_cmd = "2"
predicates = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
tempfile = "3"

[package]
name = "crozier"
# Literal, not inherited: release-plz is the only version driver and bumps this
# line; no other member is ever released.
version = "0.0.111"
edition.workspace = true
description = "Ultra-fast OpenAPI-to-SDK code generator that matches Fern's output, byte for byte."
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["openapi", "codegen", "sdk", "python", "fern"]
categories = ["command-line-utilities", "development-tools"]
# Package only what a crates.io consumer needs to build and run: the sources, the
# manifest, the readme/license/attribution, and the `templates/` embedded at
# compile time via `include_str!` (src/emit.rs). An explicit allowlist keeps the
# published crate small and — crucially — excludes the `CLAUDE.md -> AGENTS.md`
# symlink, which `cargo publish` rejects, along with CI config, scripts, and the
# Fern fixture corpus. `publish` is intentionally left at its default (true);
# the registry push runs from release.yml's `publish-crate` job, not release-plz.
include = [
    "src/**/*.rs",
    "templates/**/*.j2",
    # Fern's vendored `core/` runtime, emitted verbatim via include_str! in
    # src/emit.rs — must ship in the crate or `cargo publish`'s verify build
    # fails. `**/*` covers the nested http_sse/ subdir and the provenance README.
    "assets/**/*",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/licenses/*",
]

[[bin]]
name = "crozier"
path = "src/main.rs"

[lib]
name = "crozier"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
minijinja = { version = "2", features = ["loader"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
indexmap = { version = "2", features = ["serde"] }
schemars = "1"
# `crozier compare` generates crozier's side and receives the reference in
# temporary directories, never in the searched repository.
tempfile = { workspace = true }
thiserror = "2"
fancy-regex = "0.16"

[dev-dependencies]
tempfile = { workspace = true }
toml = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
