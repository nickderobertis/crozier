openapi: 3.1.0
info:
  title: xml-prefix
  version: 1.0.0
servers:
- url: https://probe.invalid
paths:
  /probe:
    get:
      operationId: getProbe
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeResult'
components:
  schemas:
    ProbeResult:
      type: object
      properties:
        value:
          type: string
          xml:
            name: item
            prefix: p
            namespace: https://probe.invalid/xml
      required:
      - value
