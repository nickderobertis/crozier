openapi: 3.1.0
info:
  title: array-item-inheritance-union probe
  version: 1.0.0
paths:
  /probe:
    get:
      operationId: getProbe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Probe"
components:
  schemas:
    Probe:
      type: object
      properties:
        value:
          type: array
          items:
            discriminator:
              propertyName: kind
              mapping:
                child: "#/components/schemas/Child"
    Child:
      allOf:
        - $ref: "#/components/schemas/Base"
        - type: object
          properties:
            kind:
              type: string
    Base:
      type: object
      properties:
        id:
          type: string
