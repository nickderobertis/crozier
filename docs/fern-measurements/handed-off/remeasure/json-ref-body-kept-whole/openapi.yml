openapi: 3.0.3
info:
  title: Orchard Label Register
  version: 1.0.0
paths:
  /labels:
    post:
      operationId: register_label
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelRegistration'
      responses:
        '204':
          description: Registered
  /labels/push:
    post:
      operationId: register_label
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelRegistration'
      responses:
        '204':
          description: Registered
components:
  schemas:
    LabelRegistration:
      type: object
      required: [label]
      properties:
        label:
          type: string
