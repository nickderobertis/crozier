openapi: 3.0.3
info:
  title: Patisserie Counter
  version: 1.0.0
paths:
  /orders:
    post:
      operationId: placeOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pastry'
      responses:
        '201':
          description: Placed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pastry'
components:
  schemas:
    Pastry:
      oneOf:
        - $ref: '#/components/schemas/TartOrder'
        - $ref: '#/components/schemas/Croissant'
      discriminator:
        propertyName: kind
        mapping:
          tart: '#/components/schemas/TartOrder'
          croissant: '#/components/schemas/Croissant'
    TartOrder:
      oneOf:
        - $ref: '#/components/schemas/FruitTart'
        - $ref: '#/components/schemas/CreamTart'
      discriminator:
        propertyName: crust
        mapping:
          shortcrust: '#/components/schemas/FruitTart'
          puff: '#/components/schemas/CreamTart'
    FruitTart:
      type: object
      required: [kind, crust, fruit]
      properties:
        kind:
          type: string
        crust:
          type: string
        fruit:
          type: string
    CreamTart:
      type: object
      required: [kind, crust, cream]
      properties:
        kind:
          type: string
        crust:
          type: string
        cream:
          type: string
    Croissant:
      type: object
      required: [kind, butter]
      properties:
        kind:
          type: string
        butter:
          type: boolean
