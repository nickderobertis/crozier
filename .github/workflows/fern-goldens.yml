name: Fern goldens

# Every Monday: check the newest Fern against every committed Fern reference
# crozier byte-matches against, and propose what changed as one pull request on
# `fern-goldens/update`. Each job is one phase of tools/fern-goldens/weekly.py,
# which holds every decision; see docs/fern-goldens.md.
on:
  schedule:
    # Monday 05:17 UTC. Scheduled workflows run from the default branch.
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      fern-cli-version:
        description: Exact Fern CLI (npm fern-api) version (blank resolves the newest stable)
        required: false
        type: string
      fern-version:
        description: Exact fernapi/fern-python-sdk version (blank resolves the newest stable tag)
        required: false
        type: string
      items:
        description: Comma-separated family or family:item subset, a diagnostic run that publishes nothing (blank checks every reference)
        required: false
        type: string

# One writer of `fern-goldens/update` at a time; a run never cancels another
# midway through publication.
concurrency:
  group: fern-goldens-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      run: ${{ steps.resolve.outputs.run }}
      complete: ${{ steps.resolve.outputs.complete }}
      cli: ${{ steps.resolve.outputs.cli }}
      generator: ${{ steps.resolve.outputs.generator }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the pair to check
        id: resolve
        env:
          REF: ${{ github.ref }}
          # A schedule event has no dispatch inputs: each is blank.
          CLI_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.fern-cli-version || '' }}
          GENERATOR_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.fern-version || '' }}
          ITEMS: ${{ github.event_name == 'workflow_dispatch' && inputs.items || '' }}
          TOKEN_PRESENT: ${{ secrets.RELEASE_PLZ_TOKEN != '' }}
        run: |
          set --
          if [ "$TOKEN_PRESENT" = true ]; then
            set -- --token-present
          fi
          python3 tools/fern-goldens/weekly.py resolve --ref "$REF" --cli-version "$CLI_VERSION" \
            --generator-version "$GENERATOR_VERSION" --items "$ITEMS" "$@" \
            --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

      - name: Plan the shards
        id: plan
        if: steps.resolve.outputs.run == 'true'
        env:
          CLI: ${{ steps.resolve.outputs.cli }}
          GENERATOR: ${{ steps.resolve.outputs.generator }}
          ITEMS: ${{ steps.resolve.outputs.items }}
        run: |
          python3 tools/fern-goldens/weekly.py plan --items "$ITEMS" --cli "$CLI" --generator "$GENERATOR" \
            --output .local/fern-goldens-weekly/plan.json \
            --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the plan
        if: steps.resolve.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fern-goldens-plan
          path: .local/fern-goldens-weekly/plan.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  shard:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    # The planner keeps every shard's predicted generation well inside this,
    # which is itself inside GitHub's six-hour job limit.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the Fern CLI under check
        env:
          CLI: ${{ needs.plan.outputs.cli }}
        run: npm install -g "fern-api@$CLI"

      - name: Build the comment stripper
        run: cargo build --release --locked --bin crozier

      - name: Install pinned ruff
        run: ./scripts/install-ruff.sh

      - uses: actions/download-artifact@v4
        with:
          name: fern-goldens-plan
          path: .local/fern-goldens-weekly

      - name: Generate this shard's items
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python3 tools/fern-goldens/weekly.py shard --plan .local/fern-goldens-weekly/plan.json \
            --index "$SHARD" --output ".local/fern-goldens-weekly/shard-$SHARD" --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload this shard's references and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fern-goldens-shard-${{ matrix.shard }}
          path: .local/fern-goldens-weekly/shard-${{ matrix.shard }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  assemble:
    needs: [plan, shard]
    if: always() && needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: fern-goldens-plan
          path: .local/fern-goldens-weekly

      # A shard that uploaded nothing is named by the assembly, not here.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: fern-goldens-shard-*
          path: .local/fern-goldens-weekly/shards

      - name: Combine every shard into one tree
        run: |
          python3 tools/fern-goldens/weekly.py assemble --plan .local/fern-goldens-weekly/plan.json \
            --shards .local/fern-goldens-weekly/shards --output .local/fern-goldens-weekly/bundle \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the combined tree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fern-goldens-bundle
          path: .local/fern-goldens-weekly/bundle/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  decide:
    needs: [plan, assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: astral-sh/setup-uv@v8.3.2

      # Nx included: `just fixtures-diff`, crozier's per-corpus comparison, runs
      # through it.
      - name: Bootstrap
        run: just bootstrap

      - uses: actions/download-artifact@v4
        with:
          name: fern-goldens-bundle
          path: .local/fern-goldens-weekly/bundle

      # The tree the pull request would carry: the regenerated references, the
      # candidate pair in metadata.json and every statement of it restated.
      - name: Lay the regenerated references over this checkout
        run: python3 tools/fern-goldens/weekly.py apply --bundle .local/fern-goldens-weekly/bundle

      - name: Build crozier from that tree
        run: just nx run crozier:build

      - name: Decide with crozier's own comparison
        run: |
          python3 tools/fern-goldens/weekly.py decide --bundle .local/fern-goldens-weekly/bundle \
            --output .local/fern-goldens-weekly/decision --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the decision and every comparison's report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fern-goldens-decision
          path: .local/fern-goldens-weekly/decision/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  # Only a run over the whole inventory publishes; a diagnostic subset stops at
  # its decision.
  publish:
    needs: [plan, decide]
    if: needs.plan.outputs.complete == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # A PAT, as release-plz.yml uses: a pull request opened with the default
      # GITHUB_TOKEN would trigger none of crozier's required checks.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: fern-goldens-bundle
          path: .local/fern-goldens-weekly/bundle

      - uses: actions/download-artifact@v4
        with:
          name: fern-goldens-decision
          path: .local/fern-goldens-weekly/decision

      - name: Open, update or finish the pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          python3 tools/fern-goldens/weekly.py publish --bundle .local/fern-goldens-weekly/bundle \
            --decision .local/fern-goldens-weekly/decision --repo "$GITHUB_REPOSITORY" \
            --summary "$GITHUB_STEP_SUMMARY"
