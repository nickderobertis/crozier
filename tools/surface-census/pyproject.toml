# The `surface-census` Nx project's uv workspace member (the workspace is declared in
# the root pyproject.toml). It publishes nothing: there is no [build-system],
# and `package = false` keeps uv from trying to build or install it. Its
# workspace dependencies are the members whose Python it imports, loads by path
# or runs (often as a copy in a scratch root).
[project]
name = "crozier-surface-census"
version = "0.0.0"
description = "The OpenAPI surface census, golden reach and fixture-coverage tooling."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "crozier-corpus", "crozier-llmlint-tooling", "crozier-witness-search"]

[tool.uv]
package = false

[tool.uv.sources]
crozier-corpus = { workspace = true }
crozier-llmlint-tooling = { workspace = true }
crozier-witness-search = { workspace = true }
