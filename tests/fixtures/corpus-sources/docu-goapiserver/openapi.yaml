paths:
  /sessions:
    post:
      tags:
        - sessions
      summary: Create a session
      description: Authenticate with username and password. A single JSON object is required and unknown
        properties are rejected. Returns access_token and refresh_token with HTTP 201; V3 has no refresh
        or logout operation.
      operationId: PostSessionsV3
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                access_token: <access-token>
                refresh_token: <refresh-token>
        '400':
          $ref: '#/components/responses/400'
        '405':
          $ref: '#/components/responses/405'
        '415':
          $ref: '#/components/responses/415'
        '500':
          $ref: '#/components/responses/500'
        '401':
          description: Invalid username or password. This public handler returns JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
            example:
              username: example.user
              password: <your-password>
      security: []
  /schools:
    get:
      tags:
        - schools
      summary: List schools
      description: Scoped to company_id; the handler does not restrict this read to the session school
        assignments. Returns an unpaginated array; school_ids and only_active are optional filters.
      operationId: GetSchoolsV3
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - name: school_ids
          in: query
          required: false
          description: Restrict to these school UUIDs. Accepts repeated query parameters or comma-separated
            values; empty entries are dropped and surrounding whitespace is trimmed.
          schema:
            type: array
            items:
              type: string
              format: uuid
          style: form
          explode: true
        - name: only_active
          in: query
          required: false
          description: Return active schools only. Only true/1 enables the filter; other values disable
            it.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/School'
              example: []
          headers:
            X-Total-Count:
              $ref: '#/components/headers/TotalCount'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
        '500':
          $ref: '#/components/responses/500'
  /schools/{id}:
    get:
      tags:
        - schools
      summary: Get a school
      description: Scoped to company_id; the handler does not restrict this read to the session school
        assignments. Returns 404 when the school does not exist for the requested company.
      operationId: GetSchoolsIdV3
      parameters:
        - name: id
          in: path
          required: true
          description: UUID identifying this resource.
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/School'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '500':
          $ref: '#/components/responses/500'
    patch:
      tags:
        - schools
      summary: Update school capacity
      description: Requires company_id, an authenticated session with schools assigned, and the target
        school in those assignments. Updates capacity, then reads the school in the requested company.
        A failed subsequent read can return 404 or 500 after the write has executed.
      operationId: PatchSchoolsIdV3
      parameters:
        - name: id
          in: path
          required: true
          description: UUID identifying this resource.
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/School'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '415':
          $ref: '#/components/responses/415'
        '500':
          $ref: '#/components/responses/500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSchoolRequest'
            example:
              capacity: 120
  /companies/{id}/settings:
    get:
      tags:
        - companies
      summary: Get company settings
      description: The path ID is the EMS company UUID. It must match the session company when the session
        has one. Returns 404 when the company or its settings are absent.
      operationId: GetCompaniesIdSettingsV3
      parameters:
        - name: id
          in: path
          required: true
          description: UUID identifying this resource.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanySettings'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '500':
          $ref: '#/components/responses/500'
  /companies/{id}:
    get:
      tags:
        - companies
      summary: Get a company
      description: The path ID is the EMS company UUID. It must match the session company when the session
        has one. Returns 404 when the company or its settings are absent.
      operationId: GetCompaniesIdV3
      parameters:
        - name: id
          in: path
          required: true
          description: UUID identifying this resource.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '500':
          $ref: '#/components/responses/500'
  /rooms:
    get:
      tags:
        - rooms
      summary: List rooms
      description: Scoped to company_id; the handler does not restrict this read to the session school
        assignments. school_id is required. Returns an unpaginated list.
      operationId: GetRoomsV3
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - name: school_id
          in: query
          required: true
          description: School UUID.
          schema:
            type: string
            format: uuid
          example: 22222222-2222-4222-8222-222222222222
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  anyOf:
                    - $ref: '#/components/schemas/Room'
                    - type: 'null'
              example: []
          headers:
            X-Total-Count:
              $ref: '#/components/headers/TotalCount'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
        '500':
          $ref: '#/components/responses/500'
  /rooms/{id}:
    get:
      tags:
        - rooms
      summary: Get a room
      description: Scoped to company_id; the handler does not restrict this read to the session school
        assignments. The room ID identifies the room; school_id is not required.
      operationId: GetRoomsIdV3
      parameters:
        - name: id
          in: path
          required: true
          description: UUID identifying this resource.
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '500':
          $ref: '#/components/responses/500'
  /users:
    get:
      tags:
        - users
      summary: List users
      description: Scoped to company_id; the handler does not restrict this read to the session school
        assignments. Without email, returns users sorted by updated_at and optionally filters to updated_at
        strictly after updated_after. When email is supplied, returns zero or one matching user in an
        array; updated_after is ignored and not validated in that branch.
      operationId: GetUsersV3
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - name: email
          in: query
          required: false
          description: Exact email lookup; takes precedence over updated_after.
          schema:
            type: string
            format: email
          example: user@example.com
        - name: updated_after
          in: query
          required: false
          description: Only users whose non-null updated_at is strictly later than this RFC3339 timestamp;
            applies only without email.
          schema:
            type: string
            format: date-time
          example: '2026-01-01T00:00:00Z'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
              example: []
          headers:
            X-Total-Count:
              $ref: '#/components/headers/TotalCount'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
        '500':
          $ref: '#/components/responses/500'
  /users/{id}:
    get:
      tags:
        - users
      summary: Get a user
      description: Scoped to company_id; the handler does not restrict this read to the session school
        assignments. Returns 404 when the user does not exist for the company.
      operationId: GetUsersIdV3
      parameters:
        - name: id
          in: path
          required: true
          description: UUID identifying this resource.
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '500':
          $ref: '#/components/responses/500'
  /leads:
    get:
      tags:
        - leads
      summary: List leads
      description: |-
        Scoped to company_id; the handler does not restrict this read to the session school assignments. Returns paginated lead rows, or paginated LeadStages objects when view=stages.

        Normal lookup precedence is ids, then query, then the filtered school collection. ids is limited to 200 UUIDs and missing IDs are omitted. query performs a name search with optional max_results. status, date_from/date_to and age_min/age_max are validated before these branches but only filter the normal school collection; ids and query bypass those filters. Negative ages are accepted for expected children. The age interval defaults to -12 through 180 months. date_to cannot precede date_from, and age_max cannot be smaller than age_min.

        view=stages requires the school in the session assignments and accepts only company_id, school_id, view, page and per_page. Any other parameter in this view returns 400.
      operationId: GetLeadsV3
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - name: school_id
          in: query
          required: true
          description: School UUID.
          schema:
            type: string
            format: uuid
          example: 22222222-2222-4222-8222-222222222222
        - name: view
          in: query
          required: false
          description: Omit for lead rows; stages includes per-stage timestamps.
          schema:
            type: string
            enum:
              - stages
        - name: fields
          in: query
          required: false
          description: Select response properties. Unknown names return 400. Normal lead representation
            only; names are case-sensitive. Accepts repeated query parameters or comma-separated values;
            empty entries are dropped and surrounding whitespace is trimmed.
          schema:
            type: array
            items:
              type: string
              enum:
                - lead_id
                - monday_item_id
                - first_name
                - last_name
                - school_id
                - school_name
                - status
                - date_of_birth
                - current_age
                - intended_start_date
                - periods_lead_room_available
                - parent1_name
                - parent1_email
                - parent1_mobile
                - created_at
                - updated_at
                - available_space
                - source
                - intellikid_status
                - intellikid_children_status
                - intellikid_lead_status
                - intellikid_source
                - notes
                - student_status
                - onboarding_status
                - ems_status
                - start_date
                - withdrawal_date
                - lineleader_child_id
                - lineleader_family_id
                - lineleader_center_id
                - lineleader_center_name
                - lineleader_status
                - lineleader_classroom
                - stage_inquiry_call_completed
                - stage_tour_completed
                - stage_not_viable
                - stage_not_interested
                - stage_no_response
                - stage_no_response_timed_out
                - is_crm_intended_start_date
                - lead_to_enrollment_date
                - age_at_start_date_months
                - age_at_lead_created_at_months
                - alerts
          style: form
          explode: true
        - name: ids
          in: query
          required: false
          description: Read at most 200 lead UUIDs; takes precedence over query. Accepts repeated query
            parameters or comma-separated values; empty entries are dropped and surrounding whitespace
            is trimmed.
          schema:
            type: array
            items:
              type: string
              format: uuid
            maxItems: 200
          style: form
          explode: true
        - name: query
          in: query
          required: false
          description: Name search; used only when ids is omitted.
          schema:
            type: string
        - name: max_results
          in: query
          required: false
          description: Maximum name-search results; 0 keeps the backend default.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: status
          in: query
          required: false
          description: Procare lead status; exact case required. Applies only to normal school collection.
          schema:
            type: string
            enum:
              - New
              - Contacted
              - Tour Scheduled
              - Tour Completed
              - Tour No Show
              - Discovery Day Scheduled
              - Discovery Day Completed
              - Discovery Day No Show
              - Waitlisted
              - Enrolled
              - Lost
              - No Status
        - name: date_from
          in: query
          required: false
          description: Inclusive start date in YYYY-MM-DD. Optional created-date window for the normal
            school collection.
          schema:
            type: string
            format: date
          example: '2026-01-01'
        - name: date_to
          in: query
          required: false
          description: Inclusive end date in YYYY-MM-DD. Optional created-date window for the normal school
            collection.
          schema:
            type: string
            format: date
          example: '2026-01-31'
        - name: age_min
          in: query
          required: false
          description: Minimum child age in months; normal school collection only.
          schema:
            type: number
            default: -12
        - name: age_max
          in: query
          required: false
          description: Maximum child age in months; normal school collection only.
          schema:
            type: number
            default: 180
        - name: page
          in: query
          required: false
          description: 'One-based page number. '
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: per_page
          in: query
          required: false
          description: 'Items per page; values greater than 500 are clamped to 500. '
          schema:
            type: integer
            minimum: 1
            default: 100
          example: 100
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                anyOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/Lead'
                  - type: array
                    items:
                      $ref: '#/components/schemas/LeadProjection'
                  - type: array
                    items:
                      $ref: '#/components/schemas/LeadStages'
              examples:
                projection:
                  summary: fields=lead_id,first_name,last_name
                  value:
                    - lead_id: 44444444-4444-4444-8444-444444444444
                      first_name: Example
                      last_name: Lead
                stages:
                  summary: view=stages
                  value:
                    - lead_id: 44444444-4444-4444-8444-444444444444
                      stages:
                        - stage: stage_tour_completed
                          value: 'Yes'
                          updated_at: '2026-01-15T09:30:00Z'
          headers:
            X-Total-Count:
              $ref: '#/components/headers/TotalCount'
            Link:
              $ref: '#/components/headers/Link'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
        '500':
          $ref: '#/components/responses/500'
    patch:
      tags:
        - leads
      summary: Update stages for multiple leads
      description: 'Requires school_id assigned to the session. The body is an array of 1 to 200 items,
        each with lead_id and at least one non-null stage. All items are validated before writes. Missing
        leads are omitted from the response. Repeated lead IDs are allowed; each appears once in the response
        in first-occurrence order with its final stages. The batch is not atomic: a database failure returns
        500 and stops processing after any earlier writes.'
      operationId: PatchLeadsV3
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - name: school_id
          in: query
          required: true
          description: School UUID. Must be assigned to the authenticated session.
          schema:
            type: string
            format: uuid
          example: 22222222-2222-4222-8222-222222222222
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeadStages'
          headers:
            X-Total-Count:
              $ref: '#/components/headers/TotalCount'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
        '415':
          $ref: '#/components/responses/415'
        '500':
          $ref: '#/components/responses/500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/BulkLeadStagesItem'
              minItems: 1
              maxItems: 200
            example:
              - lead_id: 44444444-4444-4444-8444-444444444444
                stages:
                  stage_tour_completed: true
  /leads/{id}:
    get:
      tags:
        - leads
      summary: Get a lead
      description: Scoped to company_id; the handler does not restrict this read to the session school
        assignments. Requires school_id. fields selects properties from the lead projection; unknown fields
        return 400. Returns 404 when the scoped lead does not exist.
      operationId: GetLeadsIdV3
      parameters:
        - name: id
          in: path
          required: true
          description: UUID identifying this resource.
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CompanyId'
        - name: school_id
          in: query
          required: true
          description: School UUID.
          schema:
            type: string
            format: uuid
          example: 22222222-2222-4222-8222-222222222222
        - name: fields
          in: query
          required: false
          description: Select response properties. Unknown names return 400.  Accepts repeated query parameters
            or comma-separated values; empty entries are dropped and surrounding whitespace is trimmed.
          schema:
            type: array
            items:
              type: string
              enum:
                - lead_id
                - monday_item_id
                - first_name
                - last_name
                - school_id
