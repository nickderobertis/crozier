  /payments:
    get:
      tags:
        - payments
      summary: List payments
      description: |-
        Scoped to company_id; the handler does not restrict this read to the session school assignments. Without group_by, returns sparse payment rows. With group_by and metrics, returns nested PaymentAggregate rows. school_id and school_ids are both applied when provided (their intersection); omitted school filters read the company scope. Row queries support family_id/family_ids; these IDs do not filter the aggregate representation. fields and pagination apply only to rows. Aggregate responses use limit, X-Total-Count and X-Truncated, without Link.

        An explicit date range requires both bounds and date_to >= date_from. These date checks occur in the data layer; failures currently produce HTTP 500 rather than 400. last_n_days and explicit bounds can both restrict the result. Item and collection school filters are independent of the session school assignments.
      operationId: GetPaymentsV3
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - name: school_id
          in: query
          required: false
          description: School UUID. Omit to use the operation's documented company/session scope.
          schema:
            type: string
            format: uuid
          example: 22222222-2222-4222-8222-222222222222
        - name: school_ids
          in: query
          required: false
          description: Optional school UUID filter. When school_id is also supplied, both filters apply.
            Accepts repeated query parameters or comma-separated values; empty entries are dropped and
            surrounding whitespace is trimmed.
          schema:
            type: array
            items:
              type: string
              format: uuid
          style: form
          explode: true
        - name: family_id
          in: query
          required: false
          description: 'Row view only: optional family UUID. When family_ids is also supplied, the reader
            first restricts to this family; family_ids cannot widen that scope.'
          schema:
            type: string
            format: uuid
        - name: family_ids
          in: query
          required: false
          description: Optional family UUIDs; row view only. Accepts repeated query parameters or comma-separated
            values; empty entries are dropped and surrounding whitespace is trimmed.
          schema:
            type: array
            items:
              type: string
              format: uuid
          style: form
          explode: true
        - name: family_name
          in: query
          required: false
          description: Case-insensitive family-name substring filter.
          schema:
            type: string
        - name: date_from
          in: query
          required: false
          description: Inclusive start date in YYYY-MM-DD. Optional; both date bounds must be supplied
            together and date_to must not precede date_from.
          schema:
            type: string
            format: date
          example: '2026-01-01'
        - name: date_to
          in: query
          required: false
          description: Inclusive end date in YYYY-MM-DD. Optional; both date bounds must be supplied together
            and date_to must not precede date_from.
          schema:
            type: string
            format: date
          example: '2026-01-31'
        - name: last_n_days
          in: query
          required: false
          description: Rolling lookback on payment created_at (not transaction_date). Positive values
            add this filter; zero/negative values do not. May be combined with a transaction-date range.
          schema:
            type: integer
        - name: state
          in: query
          required: false
          description: Case-insensitive payment state filter.
          schema:
            type: string
        - name: is_posted
          in: query
          required: false
          description: Filter by posted state; omit for both states. Accepts true/1 and false/0, case-insensitive.
          schema:
            type: boolean
        - name: successful_only
          in: query
          required: false
          description: Include payments that are posted or whose normalized state is success, succeeded,
            completed, paid, posted, processed, settled or state_success. Only true/1 enables the filter;
            other values disable it.
          schema:
            type: boolean
            default: false
        - name: payment_mode
          in: query
          required: false
          description: Case-insensitive payment mode filter.
          schema:
            type: string
        - name: payment_method_sub_kind
          in: query
          required: false
          description: Case-insensitive payment method subtype filter.
          schema:
            type: string
        - name: min_amount
          in: query
          required: false
          description: Inclusive minimum payment amount.
          schema:
            type: number
        - name: max_amount
          in: query
          required: false
          description: Inclusive maximum payment amount.
          schema:
            type: number
        - name: fields
          in: query
          required: false
          description: 'Select response properties. Unknown names return 400. Default: payment_id, family_id,
            family_name, transaction_date, amount, total_amount, state. Row view only. Accepts repeated
            query parameters or comma-separated values; empty entries are dropped and surrounding whitespace
            is trimmed.'
          schema:
            type: array
            items:
              type: string
              enum:
                - payment_id
                - transaction_id
                - school_id
                - family_id
                - family_name
                - transaction_date
                - amount
                - fee_amount
                - total_amount
                - balance
                - state
                - receipt_number
                - payment_mode
                - payment_method_sub_kind
                - description
                - is_posted
                - payd_online
                - auto_billing
                - created_at
          style: form
          explode: true
        - name: sort_by
          in: query
          required: false
          description: 'Rows: transaction_date, amount, total_amount, created_at or family_name with _asc/_desc
            (default transaction_date_desc). Aggregates: group or any supported metric with _asc/_desc.
            Unrecognized sort keys fall back to the backend default. Aggregate default: count_desc.'
          schema:
            type: string
        - name: group_by
          in: query
          required: false
          description: Select an aggregate representation; metrics must also be supplied.
          schema:
            type: string
            enum:
              - school_id
              - family_id
              - month
              - state
              - payment_mode
              - payment_method_sub_kind
        - name: metrics
          in: query
          required: false
          description: Metrics to calculate; required with group_by and invalid without it. Accepts repeated
            query parameters or comma-separated values; empty entries are dropped and surrounding whitespace
            is trimmed.
          schema:
            type: array
            items:
              type: string
              enum:
                - count
                - sum_amount
                - sum_total_amount
                - sum_fee_amount
                - avg_amount
                - avg_total_amount
                - avg_fee_amount
          style: form
