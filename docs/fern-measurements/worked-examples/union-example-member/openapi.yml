openapi: 3.0.3
info:
  title: Signal Station
  version: 1.0.0
servers:
  - url: https://signals.example.com
paths:
  /watches:
    post:
      operationId: createWatch
      tags: [watches]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Watch"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
components:
  schemas:
    Watch:
      type: object
      required: [name, trigger]
      properties:
        name:
          type: string
        trigger:
          $ref: "#/components/schemas/Trigger"
    Trigger:
      oneOf:
        - $ref: "#/components/schemas/ManualTrigger"
        - $ref: "#/components/schemas/TideTrigger"
        - $ref: "#/components/schemas/WindTrigger"
    ManualTrigger:
      type: object
      required: [operator]
      properties:
        operator:
          type: string
    TideTrigger:
      type: object
      required: [station, height_m]
      properties:
        station:
          type: string
        height_m:
          type: number
      example:
        station: harbour-mouth
        height_m: 2.5
    WindTrigger:
      type: object
      required: [knots]
      properties:
        knots:
          type: integer
      example:
        knots: 30
    Receipt:
      type: object
      properties:
        id:
          type: string
