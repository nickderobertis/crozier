openapi: 3.0.3
info:
  title: Meter Reader Gateway
  version: 1.1.0
  description: Collects readings from utility meters on a street.
servers:
  - url: https://gateway.meters.test
security:
  - meterKey: []
paths:
  /readings:
    get:
      operationId: listReadings
      parameters:
        - name: street
          in: query
          schema:
            type: string
      responses:
        '200':
          description: The latest reading per meter.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reading'
components:
  securitySchemes:
    meterKey:
      type: apiKey
      in: header
      name: X-Meter-Key
      x-fern-header:
        name: meter_token
        prefix: Meter
  schemas:
    Reading:
      type: object
      required: [meter, kwh]
      properties:
        meter:
          type: string
        kwh:
          type: number
        phase:
          type: string
          enum: [single, three]
