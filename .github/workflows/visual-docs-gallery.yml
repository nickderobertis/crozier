# Publishes the gh-pages root gallery from each push to main; screencomp's visual-docs action
# deploys to the root on a push and to /pr-<n>/ on a pull request. The pull request's capture,
# comparison and preview are steps of ci.yml's lint lane. Not a check: no pull request push
# starts it and nothing requires it.
name: Visual docs gallery

on:
  push:
    branches: [main]

permissions:
  contents: write  # push the gallery to gh-pages

# visual-docs.yml rewrites the same branch; a deploy queues rather than overlaps it.
concurrency:
  group: visual-docs-maintenance

jobs:
  publish-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: nickderobertis/screencomp@v0.4.2
        with:
          version: v0.4.2
      - name: Capture the visual docs
        run: ./screenshots/capture-visual-docs.sh
      - uses: nickderobertis/screencomp/visual-docs@v0.4.2
        with:
          arch: x86_64
          current: shots/current
          verify-second: shots/verify
          gallery-title: Visual docs
          fail-on-drift: true
          publish: true
          github-token: ${{ github.token }}
