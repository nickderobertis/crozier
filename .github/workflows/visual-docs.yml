# The gh-pages gallery's upkeep. The pull request's capture, comparison, gallery and
# comment are steps of ci.yml's lint lane; what is left here are the two events no push
# starts: a closed pull request's preview is deleted, so stale /pr-<n>/ galleries do not
# accumulate, and monthly the branch's history is pruned, keeping the 20 most recent
# versions, so committed images do not grow it without bound.
name: Visual docs maintenance

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "27 4 1 * *"

permissions:
  contents: write  # rewrite the gh-pages branch

# Rewrites of one branch queue, never overlap.
concurrency:
  group: visual-docs-maintenance

jobs:
  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: nickderobertis/screencomp/gh-pages-maintenance@v0
        with:
          mode: cleanup
          pr: ${{ github.event.pull_request.number }}
          token: ${{ github.token }}

  prune-history:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: nickderobertis/screencomp/gh-pages-maintenance@v0
        with:
          mode: prune
          keep-versions: 20
          token: ${{ github.token }}
