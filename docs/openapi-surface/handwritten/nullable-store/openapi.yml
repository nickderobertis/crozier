openapi: 3.0.3
info:
  title: Weather Archive
  version: 1.0.0
paths:
  /records:
    get:
      operationId: read_records
      responses:
        '200':
          description: Stored record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacantStore'
components:
  schemas:
    Store:
      type: object
      properties:
        code:
          type: string
    VacantStore:
      nullable: true
      allOf:
      - $ref: '#/components/schemas/Store'
