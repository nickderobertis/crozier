openapi: 3.1.0
jsonSchemaDialect: https://probe.invalid/dialect/probe
info:
  title: dollar-vocabulary
  version: 1.0.0
servers:
  - url: https://probe.invalid
paths:
  /probe:
    get:
      operationId: probe
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResult"
components:
  schemas:
    ProbeDialect:
      $id: https://probe.invalid/dialect/probe
      $schema: https://json-schema.org/draft/2020-12/schema
      title: ProbeDialect
      $vocabulary:
        https://json-schema.org/draft/2020-12/vocab/core: true
        https://json-schema.org/draft/2020-12/vocab/applicator: true
        https://json-schema.org/draft/2020-12/vocab/validation: false
        https://probe.invalid/vocab/probe: true
      type: object
    ProbeResult:
      $schema: https://probe.invalid/dialect/probe
      title: ProbeResult
      type: object
      properties:
        ok:
          type: boolean
        count:
          type: integer
          minimum: 1
      required:
        - ok
