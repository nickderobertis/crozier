openapi: 3.0.3
info: {title: probe, version: 1.0.0}
paths:
  /probe/{id}:
    get:
      operationId: probe
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Thing'}
              example: {v: "2006-01-02"}
components:
  schemas:
    Thing:
      type: object
      properties:
        v: {type: string, format: date, example: "2006-01-02T15:04:05+00:00"}
