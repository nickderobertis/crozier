# The binary e2e tier: the journeys that drive the compiled `crozier` binary as
# a subprocess (assert_cmd) over real temp dirs and the committed Fern corpus.
# Test-only and never published; its own Nx project (`crozier-e2e`) runs it
# after `crozier:build`, so an unrelated change cannot reach it. See AGENTS.md.
[package]
name = "crozier-e2e"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dev-dependencies]
# The suite reads the crate's comparison engine (`crozier::parity`) and its
# departure catalog (`crozier::departures`); the binary it drives comes from
# `crozier:build` (see tests/e2e.rs `crozier()`).
crozier = { workspace = true }
assert_cmd = { workspace = true }
predicates = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
tempfile = { workspace = true }
