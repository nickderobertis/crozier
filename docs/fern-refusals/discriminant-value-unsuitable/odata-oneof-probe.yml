openapi: 3.0.3
info:
  title: probe
  version: 1.0.0
paths:
  /assets:
    get:
      operationId: getAsset
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Asset'}
components:
  schemas:
    Asset:
      type: object
      required: ['@odata.type']
      oneOf:
        - $ref: '#/components/schemas/ImageAsset'
        - $ref: '#/components/schemas/TextAsset'
      discriminator:
        propertyName: '@odata.type'
        mapping:
          ImageAsset: '#/components/schemas/ImageAsset'
          TextAsset: '#/components/schemas/TextAsset'
    ImageAsset:
      type: object
      required: ['@odata.type']
      properties:
        '@odata.type': {type: string}
        width: {type: integer}
    TextAsset:
      type: object
      required: ['@odata.type']
      properties:
        '@odata.type': {type: string}
        text: {type: string}
