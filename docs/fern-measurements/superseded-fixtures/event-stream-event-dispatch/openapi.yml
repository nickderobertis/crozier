openapi: 3.1.0
info:
  title: Ferry Movements
  version: 1.2.0
paths:
  /routes/{routeId}/movements:
    get:
      operationId: watchMovements
      parameters:
        - name: routeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Departures and arrivals on the route.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/Movement'
  /terminals/{terminalId}/gangway:
    get:
      operationId: watchGangway
      parameters:
        - name: terminalId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The gangway lowering and rising at the terminal.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/GangwayChange'
components:
  schemas:
    Movement:
      oneOf:
        - $ref: '#/components/schemas/Departure'
        - $ref: '#/components/schemas/Arrival'
      discriminator:
        propertyName: event
        mapping:
          departed: '#/components/schemas/Departure'
          arrived: '#/components/schemas/Arrival'
    GangwayChange:
      oneOf:
        - $ref: '#/components/schemas/Lowered'
        - $ref: '#/components/schemas/Raised'
      discriminator:
        propertyName: event
    Lowered:
      type: object
      required:
        - event
        - data
      properties:
        event:
          type: string
          const: lowered
        data:
          $ref: '#/components/schemas/Berth'
    Raised:
      type: object
      required:
        - event
        - data
      properties:
        event:
          type: string
          const: raised
        data:
          $ref: '#/components/schemas/Berth'
    Departure:
      type: object
      required:
        - event
        - data
      properties:
        event:
          type: string
          enum:
            - departed
        data:
          $ref: '#/components/schemas/Berth'
    Arrival:
      type: object
      required:
        - event
        - data
      properties:
        event:
          type: string
          enum:
            - arrived
        data:
          $ref: '#/components/schemas/Berth'
    Berth:
      type: object
      properties:
        terminal:
          type: string
        minutesLate:
          type: integer
