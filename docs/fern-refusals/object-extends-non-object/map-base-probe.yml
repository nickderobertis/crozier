openapi: 3.0.3
info:
  title: probe
  version: 1.0.0
paths:
  /probe:
    get:
      operationId: probe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tagged'}
components:
  schemas:
    Label:
      type: object
      additionalProperties: {type: string}
    Tagged:
      allOf:
        - $ref: '#/components/schemas/Label'
        - type: object
          properties:
            id: {type: string}
