openapi: 3.0.3
info: {title: probe, version: 1.0.0}
paths:
  /probe:
    get:
      operationId: probe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
components:
  schemas:
    UserRole: {type: integer, example: 2}
    User:
      properties:
        role:
          type: object
          properties:
            id: {$ref: '#/components/schemas/UserRole'}
            label: {type: string}
