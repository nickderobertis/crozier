openapi: 3.0.3
info:
  title: Seed Vault
  version: 1.0.0
paths:
  /vault/{drawer}:
    put:
      tags: [Vault]
      operationId: storeSeedPacket
      parameters:
        - in: path
          name: drawer
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              format: binary
              example: string
      responses:
        '204':
          description: Stored
