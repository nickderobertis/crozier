openapi: 3.0.3
info: {title: probe, version: 1.0.0}
paths:
  /probe/{id}:
    post:
      operationId: probe
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Thing'}
      responses:
        '204': {description: No Content}
components:
  schemas:
    Thing:
      type: object
      required: [v]
      properties:
        v: {type: string, format: date, example: "2006-01-02T15:04:05+00:00"}
