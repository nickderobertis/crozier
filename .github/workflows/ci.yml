# SPIKE ONLY (spike-windows-lane-breakdown): a DO NOT MERGE draft's cut-down workflow,
# never landed. Two jobs, one per platform the spike compares: each sets up exactly as
# test-windows / test-linux do, then runs the test lane's offline targets over every
# non-promoted project uncached (the gate's broader tier, standing in for a cold
# whole-graph change), recording per-test durations (nextest's PASS lines, pytest's
# --durations, Node's TAP), crozier's own phase profile (CROZIER_PROFILE) and a few
# micro-measurements, all uploaded as artifacts. Read a run with
# `node tools/ci-profile/ci-profile.mjs run <run-id>` (tools/ci-profile/AGENTS.md).

name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Nx's task parallelism for the measured step. Nx's default is 3; 4 asks whether a fourth
  # slot pays on the runners' 4 processors.
  NX_PARALLEL: "4"

jobs:
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      SWEEP_STEP_MINUTES: "175"
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      # As test-windows: this job's own checkout and temp directories out of real-time scanning.
      - name: Leave this job's own directories out of Defender scanning
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v2
        with:
          just-version: "1.58.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-key: ${{ github.job }}
          rustflags: ""
          matcher: false
      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov,cargo-deny,cargo-machete
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Prove the installed tools run
        run: node tools/ci/require-tools.mjs just@1.58.0 node bun cargo cargo-nextest cargo-llvm-cov cargo-deny cargo-machete uv
      - name: Bootstrap
        run: just bootstrap
      # Outside the checkout, so nothing a suite reads of the tree changes.
      - name: Record the runner
        shell: bash
        run: |
          SPIKE_OUT="$RUNNER_TEMP/spike-out"
          echo "SPIKE_OUT=$SPIKE_OUT" >> "$GITHUB_ENV"
          mkdir -p "$SPIKE_OUT"
          node -e 'const os=require("os");console.log(JSON.stringify({job:process.env.GITHUB_JOB,platform:os.platform(),release:os.release(),cpus:os.cpus().length,cpu_model:os.cpus()[0]?.model,memory_bytes:os.totalmem(),nx_parallel:process.env.NX_PARALLEL}))' > "$SPIKE_OUT/runner.json"
          cat "$SPIKE_OUT/runner.json"
      # Several suites (ci, ci-journeys, gate-timing, github-workflows, llmlint-resolution)
      # read ci.yml and hold it to the real lanes' contract. They read the real file, as on
      # any other branch, so they measure their real course rather than failing on this
      # cut-down one; git is told to ignore the swap so the tree still reads as clean.
      # llmlint: ignore[changed_behavior_has_e2e] SPIKE ONLY: the swap exists so the suites that hold the real lanes' contract (tools/ci/tests/ci_workflow.rs, .github/tests/graph.test.mjs, ci-journeys) measure their real course on this never-landing branch; reconciling them with the cut-down workflow would change what they prove, which the spike may not do.
      - name: Put the real ci.yml in front of the suites
        shell: bash
        run: |
          base=$(git merge-base HEAD "origin/${GITHUB_BASE_REF:-main}")
          git show "$base:.github/workflows/ci.yml" > .github/workflows/ci.yml
          git update-index --assume-unchanged .github/workflows/ci.yml
          git status --short
      # The measured step: the test lane's offline targets over every non-promoted project,
      # uncached (the broader tier), as a cold whole-graph change would run them. The step
      # limit only makes sure the uploads below still run if it is ever reached.
      - name: Test every offline project (sweep)
        timeout-minutes: ${{ fromJSON(env.SWEEP_STEP_MINUTES) }}
        shell: bash
        env:
          CROZIER_PROFILE: ${{ runner.temp }}/crozier-profile/sweep
          CROZIER_SPIKE_STREAM: ${{ github.workspace }}/.nx/logs/sweep.stream.log
          PYTEST_ADDOPTS: --durations=0 --durations-min=0
          NEXTEST_HIDE_PROGRESS_BAR: "1"
        run: |
          mkdir -p .nx/logs "$CROZIER_PROFILE"
          start=$(date +%s)
          status=0
          just lane-test --sweep --exclude=tag:tier:promoted || status=$?
          echo "{\"step\":\"sweep\",\"seconds\":$(( $(date +%s) - start )),\"exit\":$status}" > "$SPIKE_OUT/step-sweep.json"
          mkdir -p .nx/logs/sweep && mv .nx/logs/gate-* .nx/logs/sweep/ 2>/dev/null || true
          exit $status
      # The golden replays with one `ruff format` per generation: the goldens' own byte
      # comparison proves the output unchanged, and the profiles give the formatting saving.
      - name: crozier-e2e with one ruff process per generation
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        shell: bash
        env:
          CROZIER_PROFILE: ${{ runner.temp }}/crozier-profile/e2e-batch
          CROZIER_SPIKE_RUFF_BATCH: "1"
          CROZIER_SPIKE_STREAM: ${{ github.workspace }}/.nx/logs/e2e-batch.stream.log
          NEXTEST_HIDE_PROGRESS_BAR: "1"
          NX_PARALLEL: "3"
        run: |
          mkdir -p .nx/logs "$CROZIER_PROFILE"
          start=$(date +%s)
          status=0
          just test --sweep --projects=crozier-e2e || status=$?
          echo "{\"step\":\"e2e-batch\",\"seconds\":$(( $(date +%s) - start )),\"exit\":$status}" > "$SPIKE_OUT/step-e2e-batch.json"
          mkdir -p .nx/logs/e2e-batch && mv .nx/logs/gate-* .nx/logs/e2e-batch/ 2>/dev/null || true
          exit $status
      - name: What one spawn costs here
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        shell: bash
        run: node tools/ci-profile/spike/spawn-bench.mjs "$SPIKE_OUT/spawn-bench.json" 20
      - name: Pack the crozier profiles
        if: always()
        shell: bash
        run: |
          for step in sweep sdk-env e2e-batch; do
            dir="$RUNNER_TEMP/crozier-profile/$step"
            if [ -d "$dir" ]; then find "$dir" -name '*.json' -exec cat {} + > "$SPIKE_OUT/crozier-profile-$step.jsonl"; fi
          done
          for dir in "$SPIKE_OUT"/ruff-batch/*/; do
            [ -d "$dir" ] && find "$dir" -name '*.json' -exec cat {} + > "${dir%/}.jsonl" && rm -rf "$dir"
          done
          ls -la "$SPIKE_OUT"
      - name: Upload the gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-${{ github.job }}
          path: .nx/logs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload the spike's measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-profile-${{ github.job }}
          path: ${{ env.SPIKE_OUT }}
          if-no-files-found: ignore
          retention-days: 14

