openapi: 3.1.0
info:
  title: Beacon registry
  version: 1.0.0
paths:
  /beacons:
    post:
      operationId: registerBeacon
      requestBody:
        description: The code of the beacon to register
        required: true
        content:
          text/plain:
            schema:
              $ref: '#/components/schemas/BeaconCode'
            examples:
              $ref: '#/components/examples/BeaconCode'
      responses:
        '204':
          description: Registered
  /beacons/{beaconCode}:
    get:
      operationId: getBeacon
      parameters:
        - name: beaconCode
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/BeaconCode'
          examples:
            $ref: '#/components/examples/BeaconCode'
        - name: sector
          in: query
          required: true
          schema:
            type: string
          examples:
            north: north-sector
      responses:
        '200':
          description: The beacon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beacon'
components:
  schemas:
    BeaconCode:
      type: string
      pattern: '^[a-z]+:[0-9.]+$'
    Beacon:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/BeaconCode'
        label:
          type: string
  examples:
    BeaconCode:
      lab:
        value: 'lab:1.2'
