openapi: 3.0.3
info:
  title: probe
  version: 1.0.0
paths:
  /probe:
    get:
      operationId: probe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  a: {$ref: '#/components/schemas/Thing_Item'}
                  b: {$ref: '#/components/schemas/ThingItem'}
components:
  schemas:
    Thing_Item:
      type: object
      properties:
        id: {type: string}
    ThingItem:
      type: object
      properties:
        name: {type: string}
