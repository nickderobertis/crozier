openapi: 3.1.0
info:
  title: annotated-ref-target-string-const probe
  version: 1.0.0
paths:
  /probe:
    get:
      operationId: getProbe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Probe"
components:
  schemas:
    Probe:
      type: object
      properties:
        value:
          allOf:
            - $ref: "#/components/schemas/Target"
          description: annotated
    Target:
      type: string
      const: fixed

