openapi: 3.0.3
info:
  title: Probe API
  version: 1.0.0
servers:
- url: https://probe.invalid
paths:
  /probe:
    get:
      operationId: probe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeResult'
      security:
      - ProbeScheme: []
      - BearerAuth: []
components:
  schemas:
    ProbeResult:
      type: object
      properties:
        ok:
          type: boolean
  securitySchemes:
    ProbeScheme:
      type: http
      scheme: digest
    BearerAuth:
      type: http
      scheme: bearer
