# The `repin-journey` Nx project's uv workspace member (the workspace is declared
# in the root pyproject.toml). It publishes nothing: there is no [build-system],
# and `package = false` keeps uv from trying to build or install it. A promoted
# tier: its dependencies are here so ty resolves the journey's imports.
[project]
name = "crozier-repin-journey"
version = "0.0.0"
description = "census-repin's instrumented journey over a pinned crozier clone."
requires-python = ">=3.11"
dependencies = ["crozier-surface-census"]

[tool.uv]
package = false

[tool.uv.sources]
crozier-surface-census = { workspace = true }
