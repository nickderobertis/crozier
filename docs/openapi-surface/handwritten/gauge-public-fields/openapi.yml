openapi: 3.0.3
info:
  title: Weather Archive
  version: 1.0.0
paths:
  /records:
    get:
      operationId: read_records
      responses:
        '200':
          description: Stored record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gauge'
components:
  schemas:
    Gauge:
      type: object
      properties:
        display:
          type: string
        calibration_note:
          type: string
          x-fern-ignore: true
