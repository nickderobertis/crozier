{
  "openapi": "3.0.3",
  "info": {
    "title": "Signal Observatory",
    "version": "1.0.0"
  },
  "servers": [
    {
      "url": "https://signals.example.net"
    }
  ],
  "paths": {
    "/{cycle}/signals": {
      "get": {
        "operationId": "listSignals",
        "parameters": [
          {
            "name": "cycle",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Signals",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "type": "string"
                  }
                }
              }
            }
          }
        }
      }
    }
  },
  "x-fern-base-path": {
    "path": "/{cycle}",
    "paths-include-base-path": true,
    "parameters": {
      "cycle": {
        "type": "string",
        "default": "night"
      }
    }
  }
}
