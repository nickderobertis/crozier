openapi: 3.1.0
info:
  title: Probe API
  version: 1.0.0
servers:
- url: https://probe.invalid
paths:
  /probe:
    get:
      operationId: probe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeResult'
      callbacks:
        onEvent:
          '{$request.body#/callbackUrl}':
            post:
              operationId: callback
              responses:
                '200':
                  description: OK
components:
  schemas:
    ProbeResult:
      type: object
      properties:
        ok:
          type: boolean
