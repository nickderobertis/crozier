# The `corpus-match-selection` Nx project's uv workspace member (the workspace is
# declared in the root pyproject.toml). It publishes nothing: there is no
# [build-system], and `package = false` keeps uv from trying to build or install
# it. A promoted tier: its harness is stdlib-only and drives the real nextest
# and crozier, so its suite keeps its own runner.
[project]
name = "crozier-corpus-match-selection"
version = "0.0.0"
description = "Proves the corpus byte-match's nextest selection is its inventory."
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false
