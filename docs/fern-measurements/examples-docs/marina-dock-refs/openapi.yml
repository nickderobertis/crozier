openapi: 3.0.3
info:
  title: Marina Docks
  version: 1.0.0
paths:
  /docks/{dock_id_or_code}:
    get:
      operationId: getDock
      tags: [docks]
      parameters:
        - name: dock_id_or_code
          in: path
          required: true
          schema:
            example: northbasin
            anyOf:
              - type: string
                minLength: 4
                maxLength: 16
                pattern: '^[a-z]+$'
                example: northbasin
              - type: string
                format: uuid
      responses:
        '200':
          description: The dock
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: {type: string}
