openapi: 3.1.0
info:
  title: Probe API
  version: 1.0.0
servers:
- url: https://probe.invalid
paths:
  /probe:
    post:
      operationId: probe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeResult'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                tags:
                  type: array
                  items:
                    type: string
            encoding:
              tags:
                contentType: text/plain
                allowReserved: true
components:
  schemas:
    ProbeResult:
      type: object
      properties:
        ok:
          type: boolean
