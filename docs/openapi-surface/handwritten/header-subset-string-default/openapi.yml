openapi: 3.0.3
info:
  title: Seed Ledger
  version: 1.0.0
servers:
  - url: https://seeds.example.net
paths:
  /packets:
    get:
      operationId: listPackets
      tags: [packets]
      parameters:
        - name: X-Ledger-Region
          in: header
          required: false
          schema:
            type: string
            default: north
      responses:
        "200":
          description: Packets.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
    post:
      operationId: addPacket
      tags: [packets]
      parameters:
        - name: X-Ledger-Region
          in: header
          required: false
          schema:
            type: string
            default: north
      responses:
        "204":
          description: Added.
  /packets/{packet_id}:
    get:
      operationId: getPacket
      tags: [packets]
      parameters:
        - name: packet_id
          in: path
          required: true
          schema:
            type: string
        - name: X-Ledger-Region
          in: header
          required: false
          schema:
            type: string
            default: north
      responses:
        "200":
          description: One packet.
          content:
            application/json:
              schema:
                type: string
  /status:
    get:
      operationId: getStatus
      tags: [status]
      responses:
        "200":
          description: Ledger status.
          content:
            application/json:
              schema:
                type: string
