# `x-fern-property-name` renames an object property's Python name — the model
# field and the request keyword argument — while its JSON key stays the property's
# key here. The request bodies below reproduce a real-world overlay pattern: each
# body declares a `harbor_id` property beside the operation's `harbor_id` path
# parameter, a collision Fern and crozier both refuse until the property is
# renamed. `HarborBerthAssignmentCreate.harbor_id` and the response's
# `harbor_id` declare the name in both spellings at once, holding identical
# values, so the golden also proves crozier reads the canonical
# `x-crozier-property-name` (see `../crozier-sdk-extensions/openapi.yml`). The
# remaining operations carry the extension through every other way a property
# becomes a Python name: an inline JSON body and the inline object it nests, a
# form body, and a discriminated union's variant.
openapi: 3.0.3
info: { title: Harbor API, version: 1.0.0 }
paths:
  /harbor/{harbor_id}/berth-assignments:
    post:
      operationId: createBerthAssignment
      tags: [Harbor]
      parameters:
        - name: harbor_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HarborBerthAssignmentCreate' }
      responses:
        '200':
          description: The created berth assignment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HarborBerthAssignment' }
  /harbor/{harbor_id}/voyages:
    post:
      operationId: createVoyage
      tags: [Harbor]
      parameters:
        - name: harbor_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HarborVoyageCreate' }
      responses:
        '200':
          description: The created voyage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HarborVoyage' }
  /harbor/{harbor_id}/mooring-permits:
    post:
      operationId: createMooringPermit
      tags: [Harbor]
      parameters:
        - name: harbor_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [harbor_id]
              properties:
                harbor_id:
                  type: string
                  x-fern-property-name: mooring_permit_harbor_id
                vessel:
                  type: object
                  properties:
                    hullCode:
                      type: string
                      x-fern-property-name: hull
                    rating: { type: string }
      responses:
        '200':
          description: The created permit's events.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HarborEvent' }
  /harbor/{harbor_id}/log-entries:
    post:
      operationId: createLogEntry
      tags: [Harbor]
      parameters:
        - name: harbor_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [harbor_id, body]
              properties:
                harbor_id:
                  type: string
                  x-fern-property-name: log_entry_harbor_id
                body: { type: string }
      responses:
        '204':
          description: Created.
components:
  schemas:
    HarborBerthAssignmentCreate:
      type: object
      required: [harbor_id, vessel_name]
      properties:
        harbor_id:
          type: string
          x-fern-property-name: harbor_berth_assignment_create_harbor_id
          x-crozier-property-name: harbor_berth_assignment_create_harbor_id
        vessel_name: { type: string }
        stay_hours: { type: integer }
    HarborBerthAssignment:
      type: object
      required: [id, harbor_id, vessel_name]
      properties:
        id: { type: string }
        harbor_id:
          type: string
          x-fern-property-name: owning_harbor_id
          x-crozier-property-name: owning_harbor_id
        vessel_name: { type: string }
        displayName:
          type: string
          x-fern-property-name: label
    HarborVoyageCreate:
      type: object
      required: [harbor_id, route]
      properties:
        harbor_id:
          type: string
          x-fern-property-name: harborVoyageCreateHarborId
        route: { type: string }
        tags:
          type: array
          items: { type: string }
    HarborVoyage:
      type: object
      required: [id, route]
      properties:
        id: { type: string }
        route: { type: string }
    HarborEvent:
      oneOf:
        - $ref: '#/components/schemas/HarborOpened'
        - $ref: '#/components/schemas/HarborClosed'
      discriminator:
        propertyName: kind
        mapping:
          opened: '#/components/schemas/HarborOpened'
          closed: '#/components/schemas/HarborClosed'
    HarborOpened:
      type: object
      required: [kind, harbor_id]
      properties:
        kind: { type: string }
        harbor_id:
          type: string
          x-fern-property-name: opened_harbor_id
    HarborClosed:
      type: object
      required: [kind]
      properties:
        kind: { type: string }
        closedAt:
          type: string
          x-fern-property-name: closed_on
