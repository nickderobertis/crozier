openapi: 3.0.3
info:
  title: Weather Archive
  version: 1.0.0
paths:
  /records:
    get:
      operationId: read_records
      responses:
        '200':
          description: Stored record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flower'
components:
  schemas:
    Crown:
      type: object
      properties:
        link:
          $ref: '#/components/schemas/Stem'
    Stem:
      type: object
      properties:
        link:
          $ref: '#/components/schemas/Crown'
    Flower:
      type: object
      properties:
        petals:
          type: integer
      allOf:
      - $ref: '#/components/schemas/Crown'
