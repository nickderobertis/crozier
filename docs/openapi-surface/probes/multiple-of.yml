openapi: 3.1.0
info:
  title: multiple-of
  version: 1.0.0
servers:
  - url: https://probe.invalid
paths:
  /measurement:
    get:
      operationId: getMeasurement
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Measurement"
components:
  schemas:
    Measurement:
      title: Measurement
      type: object
      properties:
        stepped:
          type: number
          multipleOf: 0.5
        steppedInteger:
          type: integer
          multipleOf: 10
        plain:
          type: number
      required:
        - stepped
        - steppedInteger
        - plain
