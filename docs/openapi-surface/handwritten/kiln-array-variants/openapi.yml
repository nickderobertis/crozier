openapi: 3.1.0
info:
  title: Kiln Controller
  version: 1.0.0
paths:
  /profiles:
    post:
      operationId: createProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phase:
                  oneOf:
                    - type: array
                      items:
                        type: string
                        enum:
                          - heating
                          - soaking
                    - type: string
                unit:
                  oneOf:
                    - type: array
                      items:
                        type: string
                        const: celsius
                    - type: integer
                zone:
                  anyOf:
                    - type: array
                      items:
                        type: string
                        const: upper
                    - type: string
      responses:
        "204":
          description: Accepted
