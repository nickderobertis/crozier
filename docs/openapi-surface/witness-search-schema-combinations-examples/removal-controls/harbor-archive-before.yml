{
  "openapi": "3.0.3",
  "info": {
    "title": "Harbor archive downloads",
    "version": "1"
  },
  "paths": {
    "/archives/{archive}": {
      "get": {
        "operationId": "download",
        "parameters": [
          {
            "name": "archive",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            },
            "example": "archive-42"
          }
        ],
        "responses": {
          "400": {
            "description": "The archive identifier was rejected.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "reason": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          },
          "200": {
            "description": "The archive contents.",
            "content": {
              "application/octet-stream": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              }
            }
          }
        }
      }
    }
  }
}
