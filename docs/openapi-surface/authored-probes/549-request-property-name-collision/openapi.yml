openapi: 3.0.3
info:
  title: probe
  version: 1.0.0
paths:
  /repos/{name}:
    patch:
      operationId: updateRepo
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '204':
          description: No Content
