openapi: 3.1.0
info:
  title: Balloon Telemetry
  version: 3.0.0
paths:
  /balloons/{balloonId}/samples:
    get:
      operationId: streamSamples
      parameters:
        - name: balloonId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Atmospheric samples, one event per reading.
          content:
            text/event-stream:
              itemSchema:
                $ref: '#/components/schemas/Sample'
components:
  schemas:
    Sample:
      type: object
      required:
        - altitude
      properties:
        altitude:
          type: number
        pressure:
          type: number
