# Comment on every pull request with the lint and type-check suppressions it
# adds (`#[allow]`, `# noqa`, `llmlint: ignore`, …), each with its rule, its
# stated reason and a link, so a reviewer sees every bypass without reading the
# diff line by line.
#
# Deliberately NOT a required status check. It skips fork pull requests (whose
# read-only token cannot upsert a comment), and a required context that never
# reports would block them forever. It is a review artifact, not a gate — the gate
# is `just check`. tests/notignored_workflow.rs holds that no ci.yml context shares
# this job's name or depends on it.

name: notignored

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

# Cancel superseded runs on the same ref: only the newest comment is wanted.
concurrency:
  group: notignored-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suppressions:
    # A fork's pull request is granted a read-only token, so the comment upsert
    # would fail on something the contributor has no way to fix.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The scan diffs against the base branch, which a shallow checkout omits.
          fetch-depth: 0

      # `@v0` floats over 0.x releases and moves only once a release has
      # published, so this review picks up notignored's fixes without a bump.
      - uses: nickderobertis/notignored@v0
