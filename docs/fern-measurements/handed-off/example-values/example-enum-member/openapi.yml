openapi: 3.0.3
info:
  title: Beacon alerts
  version: 1.0.0
paths:
  /alerts/subscriptions:
    post:
      operationId: subscribeAlerts
      tags: [alerts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kinds, callback]
              properties:
                kinds:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/AlertKind"
                callback:
                  type: string
      responses:
        "200":
          description: Subscribed
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
components:
  schemas:
    AlertKind:
      type: string
      example: beacon_lit
      enum:
        - "*"
        - beacon_lit
        - beacon_out
