{
  "openapi": "3.0.3",
  "info": {
    "title": "Harbor inventory",
    "version": "1.0.0"
  },
  "paths": {
    "/inventory": {
      "get": {
        "operationId": "inspectInventory",
        "responses": {
          "200": {
            "description": "Inventory.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "entries": {
                      "type": "array",
                      "items": {
                        "type": "string"
                      }
                    },
                    "next_cursor": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "cursor",
            "in": "query",
            "schema": {
              "type": "string"
            }
          }
        ],
        "x-fern-sdk-group-name": "inventory",
        "x-fern-pagination": {
          "cursor": "$request.cursor",
          "next_cursor": "$response.next_cursor",
          "results": "$response.entries"
        }
      }
    }
  }
}
