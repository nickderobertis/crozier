{
  "openapi": "3.1.0",
  "info": {
    "title": "Signal sampling",
    "version": "1.0.0"
  },
  "servers": [
    {
      "url": "https://signals.example.com"
    }
  ],
  "paths": {
    "/signals": {
      "get": {
        "operationId": "inspectSignals",
        "tags": [
          "signals"
        ],
        "parameters": [
          {
            "name": "samples",
            "in": "query",
            "required": false,
            "schema": {
              "type": "array",
              "items": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Accepted signal",
            "content": {
              "application/json": {
                "schema": {
                  "type": "string"
                }
              }
            }
          }
        }
      }
    }
  }
}
