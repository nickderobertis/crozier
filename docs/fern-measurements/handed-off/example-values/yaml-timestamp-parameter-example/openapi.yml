openapi: 3.1.0
info:
  title: Tide log
  version: 1.0.0
paths:
  /tides:
    get:
      operationId: listTides
      tags: [tides]
      parameters:
        - name: since
          in: query
          required: true
          schema:
            type: string
            format: date-time
          example: 2031-04-02T08:15:00Z
        - name: until
          in: query
          required: false
          schema:
            type: string
            format: date-time
          example: 2031-04-03T08:15:00Z
        - name: loggedAfter
          in: query
          required: false
          schema:
            type: string
          example: 2031-04-01T06:00:00Z
        - name: recordedOn
          in: query
          required: true
          schema:
            type: string
          example: 2031-04-01T06:00:00Z
        - name: station
          in: query
          required: false
          schema:
            type: string
          example: pier-7
      responses:
        "200":
          description: Readings
          content:
            application/json:
              schema:
                type: array
                items:
                  type: number
