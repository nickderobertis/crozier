openapi: 3.0.3
info:
  title: probe
  version: 1.0.0
paths:
  /probe:
    get:
      operationId: probe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tagged'}
components:
  schemas:
    Anchor:
      oneOf:
        - type: object
          required: [uuid]
          properties:
            uuid: {type: string}
        - type: object
          required: [path]
          properties:
            path: {type: string}
    Tagged:
      allOf:
        - $ref: '#/components/schemas/Anchor'
        - type: object
          properties:
            kind: {type: string}
