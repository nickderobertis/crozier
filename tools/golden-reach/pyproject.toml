# The `golden-reach` Nx project's uv workspace member (the workspace is declared in
# the root pyproject.toml). It publishes nothing: there is no [build-system],
# and `package = false` keeps uv from trying to build or install it.
[project]
name = "crozier-golden-reach"
version = "0.0.0"
description = "The golden-reach suites, over the surface-census scripts they load."
requires-python = ">=3.11"
dependencies = ["crozier-surface-census"]

[tool.uv]
package = false

[tool.uv.sources]
crozier-surface-census = { workspace = true }
