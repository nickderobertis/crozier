openapi: 3.0.3
info:
  title: Locker Archive Hosts
  version: 2.0.0
  description: Live parcel lockers, with closed rentals served from an archive host.
servers:
  - url: https://lockers.test/v2
paths:
  /lockers:
    get:
      operationId: listLockers
      responses:
        '200':
          description: Lockers on the concourse.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Locker'
  /rentals/closed:
    get:
      operationId: listClosedRentals
      servers:
        - url: https://archive.lockers.test/v1
          x-fern-server-name: archive
      parameters:
        - name: before
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Closed rentals.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
components:
  schemas:
    Locker:
      type: object
      required: [id]
      properties:
        id:
          type: string
        size:
          type: string
          enum: [small, large]
