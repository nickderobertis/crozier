openapi: 3.1.0
info:
  title: Kiln Action Runner
  version: 1.0.0
  description: Runs actions on studio kilns.
servers:
  - url: https://actions.example.com
paths:
  /actions/run:
    post:
      operationId: runAction
      tags: [actions]
      summary: A body property sharing its wire name with an optional header.
      parameters:
        - name: kilnToken
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunActionRequest'
      responses:
        '200':
          description: Ran.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'
  /actions/queue:
    post:
      operationId: queueAction
      tags: [actions]
      summary: A body property sharing its wire name with a required camelCase header.
      parameters:
        - name: batchLabel
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                batchLabel:
                  type: string
      responses:
        '200':
          description: Queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'
components:
  schemas:
    RunActionRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
        kilnToken:
          type: string
    ActionResult:
      type: object
      properties:
        status:
          type: string
