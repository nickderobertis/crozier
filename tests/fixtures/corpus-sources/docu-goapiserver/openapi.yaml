  /spaces/detailed_list:
    get:
      tags:
        - spaces
      summary: Get detailed spaces
      description: |-
        The session must have schools assigned. Results are restricted to those schools; an optional school_id narrows this scope and must be assigned to the session. The selected representation determines accepted parameters; every unsupported parameter returns 400.

        | Representation | Selection | Required scope and dates | Additional parameters |
        | --- | --- | --- | --- |
        | Rows | Omit view/group_by/metrics | school_id, period | room_id, room_ids, fields, sort_by, page, per_page |
        | Aggregate | Omit view; set group_by and metrics | school_id, period | room_ids, sort_by, limit |
        | Trend | view=trend | school_id, room_id | period_from, period_to, fields |
        | Projection | view=projection | school_id | room_id, room_ids, period_from, period_to, fields |
        | Periods | view=periods | Session schools | school_ids, only_active |

        All modes accept company_id and view. Periods rejects school_id; use school_ids instead. Rows are paginated. Aggregate returns flat properties for the grouping key and metrics, with default limit 50 and cap 200. Trend, projection and periods are unpaginated. Omitting both range bounds uses the available calculated horizon. If filtering, both bounds must be present and within that horizon. An inverted range returns 400; a single bound or an out-of-horizon range fails in the data layer and currently returns 500. Projection always returns one row per room and period. Without a room filter it includes all rooms. The default projection fields omit room_id and room_name, so request those fields to distinguish rooms. fields differs between SpacesRow (rows/trend) and SpacesProjection. occupancy_rate is a ratio (0.8 means 80%).
      operationId: GetSpacesDetailedListV3
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - name: school_id
          in: query
          required: false
          description: School UUID. Must be assigned to the authenticated session. Omit to use the operation's
            documented company/session scope.
          schema:
            type: string
            format: uuid
          example: 22222222-2222-4222-8222-222222222222
        - name: view
          in: query
          required: false
          description: Omit for paginated rows or aggregation selected with group_by.
          schema:
            type: string
            enum:
              - trend
              - projection
              - periods
        - name: period
          in: query
          required: false
          description: Required for rows and aggregates; not accepted in the other views.
          schema:
            type: string
            pattern: ^\d{4}-(0[1-9]|1[0-2])$
        - name: room_id
          in: query
          required: false
          description: Optional for rows/projection; required for trend; rejected for aggregates and periods.
          schema:
            type: string
            format: uuid
        - name: room_ids
          in: query
          required: false
          description: Optional for rows, aggregates and projection. Accepts repeated query parameters
            or comma-separated values; empty entries are dropped and surrounding whitespace is trimmed.
          schema:
            type: array
            items:
              type: string
              format: uuid
          style: form
          explode: true
        - name: school_ids
          in: query
          required: false
          description: Periods view only; each ID must be assigned to the session. Defaults to all assigned
            schools. Accepts repeated query parameters or comma-separated values; empty entries are dropped
            and surrounding whitespace is trimmed.
          schema:
            type: array
            items:
              type: string
              format: uuid
          style: form
          explode: true
        - name: only_active
          in: query
          required: false
          description: 'Periods view only: include only active schools. Accepts true/1 and false/0, case-insensitive.'
          schema:
            type: boolean
            default: false
        - name: period_from
          in: query
          required: false
          description: 'Trend/projection only: optional first monthly period. Omit both bounds or provide
            both within the available horizon.'
          schema:
            type: string
            pattern: ^\d{4}-(0[1-9]|1[0-2])$
        - name: period_to
          in: query
          required: false
          description: 'Trend/projection only: optional last monthly period; must not precede period_from.
            Omit both bounds or provide both within the available horizon.'
          schema:
            type: string
            pattern: ^\d{4}-(0[1-9]|1[0-2])$
        - name: fields
          in: query
          required: false
          description: Select response properties. Unknown names return 400. Rows and trend use SpacesRow
            fields; projection uses SpacesProjection fields. Invalid fields for the selected view return
            400. Accepts repeated query parameters or comma-separated values; empty entries are dropped
            and surrounding whitespace is trimmed.
          schema:
            type: array
            items:
              type: string
              enum:
                - available_spaces
                - capacity
                - closed_spaces
                - enrolled
                - is_over_enrolled
                - occupancy_rate
                - occupied_spaces
                - open_spaces
                - period
                - room_id
                - room_name
                - school_id
                - school_name
                - unavailable_spaces
          style: form
          explode: true
        - name: sort_by
          in: query
          required: false
          description: 'Rows: room_name, available_spaces, open_spaces, occupied_spaces or occupancy_rate
            with _asc/_desc. Aggregates: sum_available_spaces, sum_open_spaces, sum_occupied_spaces, sum_closed_spaces,
            sum_unavailable_spaces, capacity or occupancy_rate with _asc/_desc. Other views reject sort_by.
            Defaults: room_name_asc for rows; sum_open_spaces_desc for aggregates.'
          schema:
            type: string
        - name: group_by
          in: query
          required: false
          description: Select an aggregate representation; metrics must also be supplied.
          schema:
            type: string
            enum:
              - room_id
              - room_name
              - school_id
              - school_name
        - name: metrics
          in: query
          required: false
          description: Metrics to calculate; required with group_by and invalid without it. Accepts repeated
            query parameters or comma-separated values; empty entries are dropped and surrounding whitespace
            is trimmed.
          schema:
            type: array
            items:
              type: string
              enum:
                - sum_available_spaces
                - sum_open_spaces
                - sum_occupied_spaces
                - sum_closed_spaces
                - sum_unavailable_spaces
                - capacity
                - occupancy_rate
          style: form
          explode: true
        - name: limit
          in: query
          required: false
          description: Aggregate result limit. Defaults to 50 and clamps values above 200 to 200. If provided,
            must be positive.
          schema:
            type: integer
            minimum: 1
            default: 50
        - name: page
          in: query
          required: false
          description: One-based page number. Rows only; other representations reject pagination parameters.
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: per_page
          in: query
          required: false
          description: Items per page; values greater than 200 are clamped to 200. Rows only; other representations
            reject pagination parameters.
          schema:
            type: integer
            minimum: 1
            default: 100
          example: 100
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                anyOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/SpacesRow'
                  - type: array
                    items:
                      $ref: '#/components/schemas/SpacesAggregate'
                  - type: array
                    items:
                      $ref: '#/components/schemas/SpacesProjection'
                  - type: array
                    items:
                      $ref: '#/components/schemas/SpacesPeriods'
              examples:
                rows:
                  summary: Default row fields or trend view
                  value:
                    - school_id: 22222222-2222-4222-8222-222222222222
                      school_name: Example school
                      room_id: 55555555-5555-4555-8555-555555555555
                      room_name: Example classroom
                      period: 2026-01
                      capacity: 20
                      occupied_spaces: 16
                      available_spaces: 4
                      open_spaces: 3
                      closed_spaces: 1
                      unavailable_spaces: 0
                      occupancy_rate: 0.8
                aggregate:
                  summary: group_by=room_id&metrics=capacity,occupancy_rate
                  value:
                    - room_id: 55555555-5555-4555-8555-555555555555
                      capacity: 20
                      occupancy_rate: 0.8
                projection:
                  summary: view=projection&fields=room_id,period,enrolled,capacity,occupancy_rate
                  value:
                    - room_id: 55555555-5555-4555-8555-555555555555
                      period: 2026-01
                      enrolled: 16
                      capacity: 20
                      occupancy_rate: 0.8
                periods:
                  summary: view=periods
                  value:
                    - school_id: 22222222-2222-4222-8222-222222222222
                      school_name: Example school
                      is_active: true
                      room_count: 1
                      period_count: 1
                      periods:
                        - 2026-01
                      period_start: 2026-01
                      period_end: 2026-01
          headers:
            X-Total-Count:
              $ref: '#/components/headers/TotalCount'
            Link:
              $ref: '#/components/headers/Link'
              description: Only for the paginated row representation.
            X-Truncated:
              $ref: '#/components/headers/Truncated'
              description: Only for the aggregate representation.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
        '500':
          $ref: '#/components/responses/500'
  /spaces/closed_spaces:
    patch:
      tags:
        - spaces
      summary: Update closed spaces
      description: Requires an authenticated user in the Operations or Admin group, school_id assigned
        to the session, and room IDs belonging to that school. Each room_id/period pair must be unique
        in the body. closed_spaces must be nonnegative and no greater than room capacity. Positive values
        create/update overrides; zero removes an existing override. All cells are validated before writes.
        Upserts and deletes execute separately; a later failure may leave earlier changes applied. modified
        counts upserts plus existing rows deleted (a zero for a missing override does not increase it).
      operationId: PatchSpacesClosedSpacesV3
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - name: school_id
          in: query
          required: true
          description: School UUID. Must be assigned to the authenticated session.
          schema:
            type: string
            format: uuid
          example: 22222222-2222-4222-8222-222222222222
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateClosedSpacesResponse'
              example:
                school_id: 22222222-2222-4222-8222-222222222222
                modified: 1
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
        '415':
          $ref: '#/components/responses/415'
        '500':
          $ref: '#/components/responses/500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClosedSpacesRequest'
            example:
              closed_spaces:
                - room_id: 55555555-5555-4555-8555-555555555555
                  period: 2030-09
                  closed_spaces: 2
