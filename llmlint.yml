# yaml-language-server: $schema=https://raw.githubusercontent.com/nickderobertis/llmlint/main/assets/llmlint.schema.json
#
# The LLM-judge tier — separate from the deterministic `just check` gate.
# Run with `just lint-llm` (or `just lint-llm-diff` for the merge-base
# diff); the diff-scoped run is the blocking PR check, not part of `check`.
# Rules come from the plugin set below; tune one in place with `override: true`.
# The shared plugins are VENDORED under `llmlint-plugins/` and recorded in
# `llmlint-plugins/lock.json` — the judged tier resolves them from the tree, not
# over the network at job time, so a refused fetch can no longer fail a required
# check. That also freezes them: upstream rule changes reach this repo only
# through `just llmlint-plugins-refresh`, which re-fetches each recorded URL at
# its recorded `@pin` and rewrites both the copies and the lock. The rationale,
# the alternatives it was chosen over, and the refresh contract are in
# docs/llmlint-plugins.md.
files:
  # No `include`: llmlint lints the whole tree (exclude + .gitignore honored).
  # List committed files that shouldn't be judged (lock files, generated output).
  exclude:
    - "**/.git/**"
    # Vendored Fern output — the golden target, not crozier's own code, so it is
    # never LLM-judged. This top-level exclude is the single source of truth (the
    # diff-scoped run self-discovers files and honors it; needs llmlint >= 0.3.12).
    - "tests/fixtures/**"
    # Fern probe expectations — generated output used for normalized parity
    # comparisons, not authored source. Their 1.5M-token tree exceeds the judge's
    # input capacity; the probes and the code that produce and compare it remain
    # linted.
    - "docs/openapi-surface/probe-expected/**"
    # The hand-written fixtures' Fern trees — the same vendored Fern output, the
    # golden target each fixture's openapi.yml is byte-gated against, not
    # crozier's code. The fixtures' openapi.yml and evidence.toml stay linted.
    - "docs/openapi-surface/handwritten/*/fern-expected/**"
    # The authored probes' Fern trees — the same vendored Fern output, the
    # tree each case's openapi.yml is byte-gated against, not crozier's code.
    # Each case's openapi.yml and fern.log stay linted.
    - "docs/openapi-surface/authored-probes/*/fern-expected/**"
    # The measured parameter-lowering cases' Fern trees — the certified pair's
    # vendored output, the tree each case's openapi.yml is byte-gated against,
    # not crozier's code. Each case's openapi.yml and the README stay linted.
    - "docs/fern-measurements/*/*/fern-expected/**"
    # screencomp visual-docs artifacts — generated captures, not hand-written
    # code: the committed SVG screenshots (each ~370KB of base64-embedded font),
    # the animated GIF, the digest baseline, and the vendored binary font. They
    # are not authored source to judge, and feeding the megabytes of base64 to the
    # judge overflows it (it returns no parseable JSON). The scripts that PRODUCE
    # them (scripts/screenshots.sh, screenshots/demo-gif.py) are code and stay linted.
    - "docs/screenshots/**"
    - "shots/**"
    - "screenshots/fonts/**"
    # Witness-search evidence data — machine-written candidate records, census
    # rows, acquisition manifests, fetched publisher specifications, their
    # licences and screen logs. None is authored source, and the volume
    # overflows the judge; the scripts that write them, the gate that
    # reconciles them and every authored document stay linted.
    - "docs/openapi-surface/witness-search-*/**/*.tsv"
    - "docs/openapi-surface/witness-search-*/**/*.jsonl"
    - "docs/openapi-surface/witness-search-*/**/*.json"
    - "docs/openapi-surface/witness-search-*/**/*.gz"
    - "docs/openapi-surface/witness-search-*/**/*.yaml"
    - "docs/openapi-surface/witness-search-*/**/*.yml"
    - "docs/openapi-surface/witness-search-*/**/*.log"
    - "docs/openapi-surface/witness-search-*/**/*.txt"
    - "docs/openapi-surface/witness-search-*/**/LICENSE*"
    - "docs/openapi-surface/witness-search-*/licences/**"
    # The census-fallback samples — unmodified publisher OpenAPI documents, each
    # pinned by commit and SHA-256 in tools/surface-census/tests/data/census-fallback-sample.tsv and
    # attributed in NOTICE. The pinned Stripe description (7 MB) overflows the
    # judge as the fetched specifications above do; the manifest and the tests
    # that read the samples stay linted.
    - "tools/surface-census/tests/data/census-fallback-sample/*.y*ml"
    # The golden-reach arm searches' evidence is the same kind of data, written by
    # tools/surface-census/golden-reach-search.py: walk enumerations, query and call logs,
    # probe results and screens. The per-row records (searches/*.md), the README
    # and the scripts that write and reconcile the data stay linted.
    - "docs/openapi-surface/golden-reach-witnesses/**/*.tsv"
    - "docs/openapi-surface/golden-reach-witnesses/**/*.jsonl"
    - "docs/openapi-surface/golden-reach-witnesses/**/*.gz"
    # Vendored Fern runtime — Fern 5.20.0's own SDK support code, emitted verbatim
    # into every generated SDK (assets/README.md says which files and how they
    # were changed), not crozier's own code, so it is never LLM-judged; the
    # byte-match and the zero-error mypy test gate it. Its `# type: ignore`
    # pragmas are Fern's, kept at the lines Fern carries them, and a reason or a
    # directive beside each would ship in every SDK. The crozier-assembled
    # `client_wrapper.py` and every other asset stay linted.
    - "assets/core/__init__.py"
    - "assets/core/api_error.py"
    - "assets/core/datetime_utils.py"
    - "assets/core/enum.py"
    - "assets/core/file.py"
    - "assets/core/force_multipart.py"
    - "assets/core/http_client.py"
    - "assets/core/http_response.py"
    - "assets/core/jsonable_encoder.py"
    - "assets/core/logging.py"
    - "assets/core/pagination.py"
    - "assets/core/parse_error.py"
    - "assets/core/pydantic_utilities.py"
    - "assets/core/query_encoder.py"
    - "assets/core/remove_none_from_dict.py"
    - "assets/core/request_options.py"
    - "assets/core/serialization.py"
    - "assets/core/http_sse/**"
    - "assets/scaffolding/conftest.py"
    - "assets/scaffolding/default_clients.py.tmpl"
    - "assets/scaffolding/test_aiohttp_autodetect.py.tmpl"
    # The Fern refusal population's evidence, written by tools/fern-refusals/fern-refusals.py
    # `measure`/`probe`/`confirm`/`build`: Fern's own logs, the per-document
    # measurements, the sampled confirmations and the three machine-written
    # tables. None is authored source and the logs alone overflow the judge; the
    # script, its test, classes.tsv, findings.tsv, the probes and the README stay
    # linted.
    - "docs/openapi-surface/fern-refusals/logs/**"
    - "docs/openapi-surface/fern-refusals/probe-logs/**"
    - "docs/openapi-surface/fern-refusals/measurements.jsonl"
    - "docs/openapi-surface/fern-refusals/confirmations.tsv"
    - "docs/fern-refusals/documents.tsv"
    - "docs/fern-refusals/generated.tsv"
    - "docs/fern-refusals/unretrievable.tsv"
    # Vendored upstream rule plugins (llmlint-plugins/, refreshed by
    # tools/llmlint/llmlint-plugins.py): someone else's authored configs, judged in
    # their own repository, not crozier's code.
    - "llmlint-plugins/**"
rationales: true
# No `agents` block: the committed fallback `oneharness.toml` selects the harness.
plugins:
  # Ships INSIDE the llmlint binary and resolves offline (no fetch, no cache), so
  # it stays a URL: it is not a job-time network dependency.
  - "https://raw.githubusercontent.com/nickderobertis/llmlint/main/assets/config_lint.yml@1"
  # Vendored copies; `llmlint-plugins/lock.json` records the URL, the `@pin`, the
  # version each resolved to, its content hash, and the rules it contributes.
  - "./llmlint-plugins/base.llmlint.yml"
  - "./llmlint-plugins/shapes/cli.llmlint.yml"
  - "./llmlint-plugins/languages/rust.llmlint.yml"
  # The repo ships several shell scripts (scripts/*.sh); the bash plugin supplies
  # their rules (robust_shell, portable_to_target_shell) and the rule names the
  # scripts' `llmlint: ignore` directives reference.
  - "./llmlint-plugins/languages/bash.llmlint.yml"
  - "./llmlint-plugins/ci.llmlint.yml"
  # crozier ships versioned artifacts (release-plz → crates.io, PyPI, GitHub
  # Releases), so the releasing plugin judges the release wiring.
  - "./llmlint-plugins/releasing.llmlint.yml"
