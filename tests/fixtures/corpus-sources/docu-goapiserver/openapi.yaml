  /procare_messages:
    get:
      tags:
        - procare_messages
      summary: List incomplete Procare message tasks
      description: Lists incomplete tasks in the global message queue. Tasks are not scoped to a company
        or school. status=incomplete is required; completed-task history is not available from this operation.
        last_n_hours defaults to 6 and accepts positive fractional hours. Returns an unpaginated array.
      operationId: GetProcareMessagesV3
      parameters:
        - name: status
          in: query
          required: true
          description: Required queue selection; case-insensitive.
          schema:
            type: string
            enum:
              - incomplete
        - name: last_n_hours
          in: query
          required: false
          description: Look back this many hours; must be greater than zero.
          schema:
            type: number
            exclusiveMinimum: 0
            default: 6
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcareMessageTask'
              example: []
          headers:
            X-Total-Count:
              $ref: '#/components/headers/TotalCount'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '500':
          $ref: '#/components/responses/500'
        '502':
          $ref: '#/components/responses/502'
    post:
      tags:
        - procare_messages
      summary: Queue a Procare message
      description: Queues office_chat or classroom_chat delivery through the configured message service.
        Requires authentication but does not take company_id or enforce a company/school scope here. HTTP
        202 means the task was accepted, not that delivery has finished. Poll the relative URL in Location
        for status. Non-2xx upstream responses other than 404 become 502.
      operationId: PostProcareMessagesV3
      responses:
        '202':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcareMessageCreated'
              example:
                task_id: example-task-id
          headers:
            Location:
              description: Relative URL for polling the created task.
              schema:
                type: string
              example: /primula/api/v3/procare_messages/example-task-id
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '500':
          $ref: '#/components/responses/500'
        '502':
          $ref: '#/components/responses/502'
        '415':
          $ref: '#/components/responses/415'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProcareMessageRequest'
            example:
              type: office_chat
              username: example.user
              password: <procare-password>
              students_ids:
                - 33333333-3333-4333-8333-333333333333
              message: Example reminder.
  /procare_messages/{task_id}:
