openapi: 3.0.3
info:
  title: probe
  version: 1.0.0
paths:
  /probe:
    get:
      operationId: probe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
components:
  schemas:
    OrganisationId:
      type: string
      pattern: ^\d+$
    Member:
      type: object
      properties:
        org_id:
          type: object
          allOf:
            - $ref: '#/components/schemas/OrganisationId'
          nullable: true
