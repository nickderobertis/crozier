openapi: 3.0.3
info: {title: probe, version: 1.0.0}
paths:
  /probe:
    post:
      operationId: probe
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Thing'}
      responses:
        '204': {description: No Content}
components:
  schemas:
    Thing:
      type: object
      properties:
        v: {type: string, format: date, example: "2006-01-02T15:04:05+00:00"}
