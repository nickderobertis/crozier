openapi: 3.0.3
info:
  title: sample
  version: 1.0.0
paths:
  /dispatches:
    get:
      operationId: getDispatch
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispatch"
components:
  schemas:
    Dispatch:
      type: object
      properties:
        note:
          type: string
      allOf:
        - type: object
          properties:
            label:
              type: string
          required: [label]
