openapi: 3.0.3
info:
  title: Windmill Telemetry
  version: 1.0.0
paths:
  /sails/rotations:
    get:
      operationId: streamRotations
      tags: [sails]
      responses:
        "200":
          description: One event per rotation.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/Rotation"
        "400":
          description: The sails are furled.
          content:
            application/json:
              schema:
                type: string
components:
  schemas:
    Rotation:
      type: object
      required: [rpm]
      properties:
        rpm:
          type: number
