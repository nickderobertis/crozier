  /enrollments:
    get:
      tags:
        - enrollments
      summary: List enrollment series
      description: |-
        Scoped to company_id; the handler does not restrict this read to the session school assignments. The response representation is selected in this order:

        | Selection | Response | Date selectors |
        | --- | --- | --- |
        | view=trend | EnrollmentTrend array | Optional period_from/period_to |
        | group_by=period (unless trend) | EnrollmentPeriodAnalytics array | year_from/year_to |
        | view=analytics, group_by=month | EnrollmentAnalytics array | period_from/period_to |
        | Default: view=basic, group_by=month | EnrollmentMonthly array | period_from/period_to |

        Monthly basic/analytics default to 2023-01 through the current month. Period analytics defaults to 2023 through the current year. Trend uses the available calculated periods when bounds are omitted. No pagination is implemented. Each representation returns its row count in X-Total-Count. For view=trend, omit both range bounds or provide both; endpoints must lie within the available horizon. Incomplete, invalid, inverted or out-of-horizon trend ranges fail in the data layer and currently return HTTP 500.
      operationId: GetEnrollmentsV3
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - name: school_id
          in: query
          required: true
          description: School UUID.
          schema:
            type: string
            format: uuid
          example: 22222222-2222-4222-8222-222222222222
        - name: view
          in: query
          required: false
          description: Select the representation.
          schema:
            type: string
            enum:
              - basic
              - analytics
              - trend
            default: basic
        - name: group_by
          in: query
          required: false
          description: period implies period analytics unless view=trend.
          schema:
            type: string
            enum:
              - month
              - period
            default: month
        - name: period_from
          in: query
          required: false
          description: First monthly period for monthly or trend views.
          schema:
            type: string
            pattern: ^\d{4}-(0[1-9]|1[0-2])$
        - name: period_to
          in: query
          required: false
          description: Last monthly period for monthly or trend views.
          schema:
            type: string
            pattern: ^\d{4}-(0[1-9]|1[0-2])$
        - name: year_from
          in: query
          required: false
          description: First year for group_by=period; defaults to 2023.
          schema:
            type: string
            pattern: ^\d{4}$
            default: '2023'
        - name: year_to
          in: query
          required: false
          description: Last year for group_by=period; defaults to the current year.
          schema:
            type: string
            pattern: ^\d{4}$
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                anyOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/EnrollmentMonthly'
                  - type: array
                    items:
                      $ref: '#/components/schemas/EnrollmentAnalytics'
                  - type: array
                    items:
                      $ref: '#/components/schemas/EnrollmentPeriodAnalytics'
                  - type: array
                    items:
                      $ref: '#/components/schemas/EnrollmentTrend'
          headers:
            X-Total-Count:
              $ref: '#/components/headers/TotalCount'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
        '500':
          $ref: '#/components/responses/500'
  /family_balances:
    get:
      tags:
        - family_balances
      summary: List family balances and ledgers
      description: |-
        Scoped to company_id; the handler does not restrict this read to the session school assignments. Default: sparse balance rows, one per family, with optional fields. group_by plus metrics selects nested FamilyBalanceAggregate rows; family_ids does not filter aggregates. school_id and school_ids are both applied when provided (their intersection).

        view=transactions takes precedence and returns FamilyLedger objects (family_id, student_ids, transactions). This view requires school_id assigned to the session. It ignores balance filters, fields, school_ids and grouping after the shared filter parser validates supplied filter values. last_n_days defaults to 30 and is clamped to 0..365. Pagination applies to families, not to transactions inside each family.

        Balance rows use per_page capped at 200; transaction-family pages use 500. Aggregates use limit and X-Truncated without Link.
      operationId: GetFamilyBalancesV3
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - name: school_id
          in: query
          required: false
          description: School UUID. Omit to use the operation's documented company/session scope.
          schema:
            type: string
            format: uuid
          example: 22222222-2222-4222-8222-222222222222
        - name: school_ids
          in: query
          required: false
          description: Optional school UUID filter. When school_id is also supplied, both filters apply.
            Accepts repeated query parameters or comma-separated values; empty entries are dropped and
            surrounding whitespace is trimmed.
          schema:
            type: array
            items:
              type: string
              format: uuid
          style: form
          explode: true
        - name: family_ids
          in: query
          required: false
          description: Optional family UUIDs; balance row view only. Accepts repeated query parameters
            or comma-separated values; empty entries are dropped and surrounding whitespace is trimmed.
          schema:
            type: array
            items:
              type: string
              format: uuid
          style: form
          explode: true
        - name: family_name
          in: query
          required: false
          description: Case-insensitive family-name substring filter; balance rows and aggregates.
          schema:
            type: string
        - name: balance_min
          in: query
          required: false
          description: Inclusive minimum balance; balance rows and aggregates.
          schema:
            type: number
        - name: balance_max
          in: query
          required: false
          description: Inclusive maximum balance; balance rows and aggregates.
          schema:
            type: number
        - name: fields
          in: query
          required: false
          description: 'Select response properties. Unknown names return 400. Default: family_id, family_name,
            balance, transaction_date. Balance row view only. Accepts repeated query parameters or comma-separated
            values; empty entries are dropped and surrounding whitespace is trimmed.'
          schema:
            type: array
            items:
              type: string
              enum:
                - family_id
                - school_id
                - family_name
                - family_student_count
                - transaction_id
                - transaction_date
                - amount
                - balance
                - receipt_number
                - kind
          style: form
          explode: true
        - name: sort_by
          in: query
          required: false
          description: 'Rows: balance, family_name or transaction_date with _asc/_desc. Aggregates: group
            or a supported metric with _asc/_desc. Unsupported keys use the backend default. Defaults:
            balance_desc for rows, count_desc for aggregates.'
          schema:
            type: string
        - name: view
          in: query
          required: false
          description: Read per-family transaction ledgers; takes precedence over grouping.
          schema:
            type: string
            enum:
              - transactions
        - name: last_n_days
          in: query
          required: false
          description: 'Transactions only: defaults to 30 and clamps to 0 through 365.'
          schema:
            type: integer
            default: 30
        - name: group_by
          in: query
          required: false
          description: Select an aggregate representation; metrics must also be supplied.
          schema:
            type: string
            enum:
              - school_id
              - family_id
              - family_name
        - name: metrics
          in: query
          required: false
          description: Metrics to calculate; required with group_by and invalid without it. Accepts repeated
            query parameters or comma-separated values; empty entries are dropped and surrounding whitespace
            is trimmed.
          schema:
            type: array
            items:
              type: string
              enum:
                - count
                - sum_balance
                - avg_balance
                - min_balance
                - max_balance
                - sum_positive_balance
                - sum_negative_balance
                - count_zero_balance
          style: form
          explode: true
        - name: limit
          in: query
          required: false
          description: Aggregate result limit. Defaults to 50 and clamps values above 200 to 200. Zero
            and negative values use the default.
          schema:
            type: integer
            default: 50
        - name: page
          in: query
          required: false
          description: One-based page number. Balance rows clamp at 200; view=transactions instead clamps
            at 500.
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: per_page
          in: query
          required: false
          description: Items per page; values greater than 200 are clamped to 200. Balance rows clamp
            at 200; view=transactions instead clamps at 500.
          schema:
            type: integer
            minimum: 1
            default: 100
          example: 100
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                anyOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/FamilyBalance'
                  - type: array
                    items:
                      $ref: '#/components/schemas/FamilyBalanceAggregate'
                  - type: array
                    items:
                      $ref: '#/components/schemas/FamilyLedger'
              examples:
                rows:
                  summary: Default balance fields
                  value:
                    - family_id: 77777777-7777-4777-8777-777777777777
                      family_name: Example family
                      balance: 150
                      transaction_date: '2026-01-15'
                aggregate:
                  summary: group_by=school_id&metrics=count,sum_balance
                  value:
                    - group:
                        school_id: 22222222-2222-4222-8222-222222222222
                      metrics:
                        count: 1
                        sum_balance: 150
                transactions:
                  summary: view=transactions
                  value:
                    - family_id: 77777777-7777-4777-8777-777777777777
                      student_ids:
                        - 33333333-3333-4333-8333-333333333333
                      transactions:
                        - id: 88888888-8888-4888-8888-888888888888
                          date: '2026-01-15T00:00:00Z'
                          student_id: 33333333-3333-4333-8333-333333333333
                          type: invoice
                          description: Example tuition
                          status: posted
                          amount: 150
                          balance: 150
          headers:
            X-Total-Count:
              $ref: '#/components/headers/TotalCount'
            Link:
              $ref: '#/components/headers/Link'
              description: For balance rows and view=transactions; omitted for aggregates.
            X-Truncated:
              $ref: '#/components/headers/Truncated'
              description: Only for aggregates.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
        '500':
          $ref: '#/components/responses/500'
