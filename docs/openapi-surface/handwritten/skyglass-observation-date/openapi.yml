openapi: 3.0.3
info:
  title: Skyglass Observation Date
  version: 1.0.0
paths:
  /observation-date:
    post:
      operationId: record_observation_date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              format: date
      responses:
        '204':
          description: Recorded
