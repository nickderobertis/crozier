openapi: 3.0.3
info:
  title: sample
  version: 1.0.0
paths:
  /tallies:
    get:
      operationId: getTally
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tally'
components:
  schemas:
    Tally:
      anyOf:
        - type: object
          properties:
            kind:
              type: string
              enum: [cat]
            purrs:
              type: boolean
        - type: object
          properties:
            kind:
              type: string
              enum: [dog]
            barks:
              type: boolean
