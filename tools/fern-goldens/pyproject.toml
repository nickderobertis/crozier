# The `fern-goldens` Nx project's uv workspace member (the workspace is declared in
# the root pyproject.toml). It publishes nothing: there is no [build-system],
# and `package = false` keeps uv from trying to build or install it. Its
# workspace dependencies are the members whose Python it imports, loads by path
# or runs (often as a copy in a scratch root).
[project]
name = "crozier-fern-goldens"
version = "0.0.0"
description = "Fern goldens lifecycle helpers (the golden overlay) and their suite."
requires-python = ">=3.11"
dependencies = ["crozier-corpus"]

[tool.uv]
package = false

[tool.uv.sources]
crozier-corpus = { workspace = true }
