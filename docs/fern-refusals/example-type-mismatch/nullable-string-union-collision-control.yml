openapi: 3.1.0
info: {title: probe, version: 1.0.0}
paths:
  /probe:
    get:
      operationId: probe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/subscription'}
components:
  schemas:
    subscription:
      type: object
      properties:
        schedule: {anyOf: [{type: string}, {type: 'null'}]}
    subscription_schedule: {type: object, properties: {id: {type: string}}}
