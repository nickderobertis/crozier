openapi: 3.0.3
info:
  title: Weather Archive
  version: 1.0.0
paths:
  /records:
    get:
      operationId: read_records
      responses:
        '200':
          description: Stored record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Seal'
components:
  schemas:
    Seal:
      type: object
      properties:
        verified:
          type: boolean
          x-fern-type: literal<true>
        ordinary:
          type: boolean
