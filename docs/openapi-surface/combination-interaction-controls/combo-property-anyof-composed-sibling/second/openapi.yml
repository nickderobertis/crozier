openapi: 3.0.3
info:
  title: sample
  version: 1.0.0
paths:
  /tallies:
    get:
      operationId: getTally
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tally'
components:
  schemas:
    Tally:
      type: object
      properties:
        stuff:
          anyOf:
            - oneOf:
                - type: number
                - type: string
            - type: 'null'
    Count:
      type: object
      properties:
        total:
          type: integer
