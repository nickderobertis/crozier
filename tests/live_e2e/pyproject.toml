# The `live-e2e` Nx project's uv workspace member (the workspace is declared in
# the root pyproject.toml). It publishes nothing: there is no [build-system],
# and `package = false` keeps uv from trying to build or install it. A promoted
# tier: its dependencies are here so ty resolves the harness's imports; the
# tier's own runner still builds the environment its suite runs in.
[project]
name = "crozier-live-e2e"
version = "0.0.0"
description = "The live e2e harness: generated SDKs driven against a Prism mock."
requires-python = ">=3.11"
dependencies = ["httpx>=0.28", "pydantic>=2", "pytest>=8.4", "PyYAML>=6"]

[tool.uv]
package = false
