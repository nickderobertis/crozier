# Supply-chain gate (`cargo deny check`). Run once on Linux in `just check`.

[advisories]
version = 2
# Each ignored advisory carries its tracked rationale inline.
ignore = []

[licenses]
version = 2
# Explicit allow-list: a new dependency on a license not listed fails the gate,
# forcing a deliberate decision rather than a silent policy drift.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
# Duplicate transitive versions are common and not a correctness issue; don't
# fail on them. Wildcard version requirements are banned — they defeat the lock.
multiple-versions = "allow"
wildcards = "deny"
deny = [
    { name = "serde_yaml", reason = "RUSTSEC-2024-0449: avoid the unmaintained libyaml translation" },
    { name = "serde_yaml_ng", reason = "RUSTSEC-2024-0449: avoid the unmaintained libyaml translation" },
    { name = "serde_norway", reason = "RUSTSEC-2024-0449: avoid the unmaintained libyaml translation" },
    { name = "serde_yml", reason = "RUSTSEC-2024-0449: avoid the unmaintained libyaml translation" },
    { name = "unsafe-libyaml", reason = "RUSTSEC-2024-0449: avoid the unmaintained libyaml translation" },
    { name = "unsafe-libyaml-norway", reason = "RUSTSEC-2024-0449: avoid the unmaintained libyaml translation" },
    { name = "libyml", reason = "RUSTSEC-2024-0449: avoid the unmaintained libyaml translation" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
