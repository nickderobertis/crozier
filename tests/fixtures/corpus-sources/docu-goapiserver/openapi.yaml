      description: |-
        Scoped to company_id; the handler does not restrict this read to the session school assignments. Returns consolidated billing-plan rows, or nested BillingPlanAggregate rows when group_by and metrics are supplied. school_id is always required. A consolidated row keeps the ID of the first plan in its group.

        Rows support plan_status, room filters, query, has_alerts, active_rooms_only and pagination; sorting rows returns 400. Aggregates use school, room filters, plan_status (default active), group_by, metrics, sort_by and limit. query, has_alerts and active_rooms_only do not affect aggregate results, although boolean values are parsed and validated. X-Has-Alerts applies only to row responses; X-Room-Filter-Count and X-Truncated apply only to aggregates.
      operationId: GetBillingPlansV3
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - name: school_id
          in: query
          required: true
          description: School UUID.
          schema:
            type: string
            format: uuid
          example: 22222222-2222-4222-8222-222222222222
        - name: room_id
          in: query
          required: false
          description: Alias combined with room_ids. Accepts repeated query parameters or comma-separated
            values; empty entries are dropped and surrounding whitespace is trimmed.
          schema:
            type: array
            items:
              type: string
              format: uuid
          style: form
          explode: true
        - name: room_ids
          in: query
          required: false
          description: Optional room UUID filters, combined with room_id. Accepts repeated query parameters
            or comma-separated values; empty entries are dropped and surrounding whitespace is trimmed.
          schema:
            type: array
            items:
              type: string
              format: uuid
          style: form
          explode: true
        - name: plan_status
          in: query
          required: false
          description: Free-text plan status. Aggregate view defaults to active when omitted.
          schema:
            type: string
        - name: query
          in: query
          required: false
          description: 'Row view only: search text.'
          schema:
            type: string
        - name: has_alerts
          in: query
          required: false
          description: 'Row view only: return only plans with alerts when true. Accepts true/1 and false/0,
            case-insensitive.'
          schema:
            type: boolean
            default: false
        - name: active_rooms_only
          in: query
          required: false
          description: 'Row view only: restrict to active rooms. Accepts true/1 and false/0, case-insensitive.'
          schema:
            type: boolean
            default: false
        - name: sort_by
          in: query
          required: false
          description: Aggregate view only. Sending sort_by without group_by returns 400.
          schema:
            type: string
            enum:
              - sum_monthly_invoice_asc
              - sum_monthly_invoice_desc
              - avg_monthly_invoice_asc
              - avg_monthly_invoice_desc
              - count_students_asc
              - count_students_desc
              - group_asc
              - group_desc
        - name: group_by
          in: query
          required: false
          description: Select an aggregate representation; metrics must also be supplied.
          schema:
            type: string
            enum:
              - school_id
              - school_name
              - room_id
              - room_name
        - name: metrics
          in: query
          required: false
          description: Metrics to calculate; required with group_by and invalid without it. Accepts repeated
            query parameters or comma-separated values; empty entries are dropped and surrounding whitespace
            is trimmed.
          schema:
            type: array
            items:
              type: string
              enum:
                - sum_monthly_invoice
                - avg_monthly_invoice
                - count_students
          style: form
          explode: true
        - name: limit
          in: query
          required: false
          description: Aggregate result limit. Defaults to 50 and clamps values above 200 to 200. Zero
            and negative values use the default.
          schema:
            type: integer
            default: 50
        - name: page
          in: query
          required: false
          description: One-based page number. Row view only.
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: per_page
          in: query
          required: false
          description: Items per page; values greater than 500 are clamped to 500. Row view only.
          schema:
            type: integer
            minimum: 1
            default: 100
          example: 100
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                anyOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/BillingPlan'
                  - type: array
                    items:
                      $ref: '#/components/schemas/BillingPlanAggregate'
          headers:
            X-Total-Count:
              $ref: '#/components/headers/TotalCount'
            Link:
              $ref: '#/components/headers/Link'
              description: Only for rows.
            X-Has-Alerts:
              $ref: '#/components/headers/HasAlerts'
              description: Only for rows.
            X-Room-Filter-Count:
              $ref: '#/components/headers/RoomFilterCount'
              description: Only for aggregates.
            X-Truncated:
              $ref: '#/components/headers/Truncated'
              description: Only for aggregates.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
        '500':
          $ref: '#/components/responses/500'
