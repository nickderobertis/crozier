  /attendances:
    get:
      tags:
        - attendances
      summary: List attendance records
      description: Scoped to company_id; the handler does not restrict this read to the session school
        assignments. Provide date_from AND date_to, or a positive last_n_days; mixing them returns 400.
        Defaults min_hours to 2; records below that threshold are excluded. room_id/room_ids and student_id/student_ids
        are merged. Row responses are sparse Attendance objects and support fields and pagination; sort_by
        on rows returns 400. group_by plus metrics selects nested AttendanceAggregate rows with a limit
        instead of pagination. Room/student filter counts, when positive, are returned in headers.
      operationId: GetAttendancesV3
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - name: school_id
          in: query
          required: true
          description: School UUID.
          schema:
            type: string
            format: uuid
          example: 22222222-2222-4222-8222-222222222222
        - name: room_id
          in: query
          required: false
          description: Alias combined with room_ids. Accepts repeated query parameters or comma-separated
            values; empty entries are dropped and surrounding whitespace is trimmed.
          schema:
            type: array
            items:
              type: string
              format: uuid
          style: form
          explode: true
        - name: room_ids
          in: query
          required: false
          description: Optional room UUIDs; combined with room_id. Accepts repeated query parameters or
            comma-separated values; empty entries are dropped and surrounding whitespace is trimmed.
          schema:
            type: array
            items:
              type: string
              format: uuid
          style: form
          explode: true
        - name: student_id
          in: query
          required: false
          description: Alias combined with student_ids. Accepts repeated query parameters or comma-separated
            values; empty entries are dropped and surrounding whitespace is trimmed.
          schema:
            type: array
            items:
              type: string
              format: uuid
          style: form
          explode: true
        - name: student_ids
          in: query
          required: false
          description: Optional student UUIDs; combined with student_id. Accepts repeated query parameters
            or comma-separated values; empty entries are dropped and surrounding whitespace is trimmed.
          schema:
            type: array
            items:
              type: string
              format: uuid
          style: form
          explode: true
        - name: date_from
          in: query
          required: false
          description: Inclusive start date in YYYY-MM-DD. Both dates required unless last_n_days is supplied.
          schema:
            type: string
            format: date
          example: '2026-01-01'
        - name: date_to
          in: query
          required: false
          description: Inclusive end date in YYYY-MM-DD. Both dates required unless last_n_days is supplied.
          schema:
            type: string
            format: date
          example: '2026-01-31'
        - name: last_n_days
          in: query
          required: false
          description: Positive rolling-window length; cannot be combined with either explicit date bound.
          schema:
            type: integer
            minimum: 1
        - name: min_hours
          in: query
          required: false
          description: Minimum hours attended per record. Use zero to include records below the historical
            two-hour threshold.
          schema:
            type: number
            minimum: 0
            default: 2
        - name: fields
          in: query
          required: false
          description: 'Select response properties. Unknown names return 400. Default: student_id, date,
            room_id, room_name, hours_attended. Row view only. Accepts repeated query parameters or comma-separated
            values; empty entries are dropped and surrounding whitespace is trimmed.'
          schema:
            type: array
            items:
              type: string
              enum:
                - attendance_id
                - student_id
                - date
                - room_id
                - room_name
                - hours_attended
                - sign_in_time
                - sign_out_time
          style: form
          explode: true
        - name: sort_by
          in: query
          required: false
          description: Aggregate view only; sending sort_by without group_by returns 400. Default group_asc.
          schema:
            type: string
            enum:
              - group_asc
              - group_desc
              - attendance_days_asc
              - attendance_days_desc
              - total_records_asc
              - total_records_desc
              - sum_hours_asc
              - sum_hours_desc
              - avg_hours_asc
              - avg_hours_desc
              - distinct_students_asc
              - distinct_students_desc
        - name: group_by
          in: query
          required: false
          description: Select an aggregate representation; metrics must also be supplied.
          schema:
            type: string
            enum:
              - student_id
              - room_id
              - room_name
              - date
              - month
        - name: metrics
          in: query
          required: false
          description: Metrics to calculate; required with group_by and invalid without it. Accepts repeated
            query parameters or comma-separated values; empty entries are dropped and surrounding whitespace
            is trimmed.
          schema:
            type: array
            items:
              type: string
              enum:
                - attendance_days
                - total_records
                - sum_hours
                - avg_hours
                - distinct_students
          style: form
          explode: true
        - name: limit
          in: query
          required: false
          description: Aggregate result limit. Defaults to 50 and clamps values above 200 to 200. Zero
            and negative values use the default.
          schema:
            type: integer
            default: 50
        - name: page
          in: query
          required: false
          description: One-based page number. Row view only.
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: per_page
          in: query
          required: false
          description: Items per page; values greater than 200 are clamped to 200. Row view only.
          schema:
            type: integer
            minimum: 1
            default: 100
          example: 100
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                anyOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/Attendance'
                  - type: array
                    items:
                      $ref: '#/components/schemas/AttendanceAggregate'
              examples:
                rows:
                  summary: Default attendance fields
                  value:
                    - student_id: 33333333-3333-4333-8333-333333333333
                      date: '2026-01-15'
                      room_id: 55555555-5555-4555-8555-555555555555
                      room_name: Example classroom
                      hours_attended: 6
                aggregate:
                  summary: group_by=room_id&metrics=total_records,sum_hours
                  value:
                    - group:
                        room_id: 55555555-5555-4555-8555-555555555555
                      metrics:
                        total_records: 1
                        sum_hours: 6
          headers:
            X-Total-Count:
              $ref: '#/components/headers/TotalCount'
            Link:
              $ref: '#/components/headers/Link'
              description: Only for rows.
            X-Truncated:
              $ref: '#/components/headers/Truncated'
              description: Only for aggregates.
            X-Room-Filter-Count:
              $ref: '#/components/headers/RoomFilterCount'
            X-Student-Filter-Count:
              $ref: '#/components/headers/StudentFilterCount'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
        '500':
          $ref: '#/components/responses/500'
