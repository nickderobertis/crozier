openapi: 3.0.3
info:
  title: Weather Archive
  version: 1.0.0
paths:
  /records:
    get:
      operationId: read_records
      responses:
        '200':
          description: Stored record
          content:
            application/json:
              schema:
                type: object
                properties:
                  observer:
                    anyOf:
                    - type: object
                      properties:
                        name:
                          type: string
                      description: Observer of the measurement.
                    - type: 'null'
                  bearing:
                    anyOf:
                    - type: string
                      enum:
                      - east
                      - west
                      description: The observed bearing.
                    - type: 'null'
components:
  schemas: {}
