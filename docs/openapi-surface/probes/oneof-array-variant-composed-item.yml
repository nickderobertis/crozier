openapi: 3.1.0
info:
  title: oneof-array-variant-composed-item probe
  version: 1.0.0
paths:
  /probe:
    get:
      operationId: getProbe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Probe"
components:
  schemas:
    Probe:
      oneOf:
        - type: array
          items:
            allOf:
              - type: object
                properties:
                  name: { type: string }
        - type: integer

