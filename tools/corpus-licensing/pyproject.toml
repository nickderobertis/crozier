# The `corpus-licensing` Nx project's uv workspace member (the workspace is declared in
# the root pyproject.toml). It publishes nothing: there is no [build-system],
# and `package = false` keeps uv from trying to build or install it.
[project]
name = "crozier-corpus-licensing"
version = "0.0.0"
description = "The corpus-licensing drift lint and its git-driven suite."
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false
