openapi: 3.0.3
info:
  title: Film Shot Planner
  version: 2.0.1
  description: Plans the camera set-ups for a day's shooting.
servers:
  - url: https://planner.film.test
paths:
  /scenes/{sceneId}/settings:
    get:
      operationId: getSettings
      parameters:
        - name: sceneId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The scene's camera settings.
          content:
            application/json:
              schema:
                type: object
                required: [mode]
                properties:
                  mode:
                    type: string
                    enum: [wide, medium, close]
                    x-fern-type-name: ShotSize
                  lens:
                    type: object
                    x-fern-type-name: LensSpec
                    properties:
                      focalLength:
                        type: integer
                      anamorphic:
                        type: boolean
                  light:
                    type: string
                    enum: [day, night]
components:
  schemas:
    Camera:
      type: object
      required: [body]
      properties:
        body:
          type: string
        iso:
          type: string
          enum: [low, high]
          x-fern-type-name: IsoBand
