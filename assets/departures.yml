# The catalog of crozier's intended departures from Fern's output: every place
# crozier writes something other than what Fern writes, on purpose. It is
# compiled into the binary (src/departures.rs), and every comparison of crozier's
# output with Fern's — `crozier compare` and every golden comparison in the test
# suite — applies it through one engine (src/parity.rs). Each entry's rule, which
# recognises exactly Fern's construct and crozier's replacement in a pair of
# files, is the function of the same id in src/departures.rs.
#
# docs/departures/README.md holds the rendered reference (a drift test keeps it
# equal to this file), what each key holds, the defect rule, and how a fix adds
# an entry. Entries are sorted by `id`.

- id: binary-json-body-example
  kind: fern-defect
  trigger: An inline application/json binary string body is annotated bytes and its worked example passes the default plain string.
  fern: Sync and async client docstrings, README and reference.md pass request="string" to a bytes parameter; reference.md also documents that argument as str.
  crozier: Those exact default example values are b"string", and the reference parameter type is bytes; the bytes annotation and json=request remain matched.
  reason: Checking the example against the actual generated bytes annotation rejects the plain string. The corrected bytes value has the right type and the matched SDK wrapper serializes it to JSON.
  evidence: docs/departures/evidence/binary-json-body-example.md

- id: body-query-parameter-value
  kind: fern-defect
  trigger: >-
    An inline JSON body property sharing its wire key with a query parameter,
    where the method signature renames the body argument to avoid the collision.
  fern: >-
    The query parameter's variable as the JSON property's value, including
    inside convert_and_respect_annotation_metadata.
  crozier: >-
    The renamed body argument as the JSON property's value, retaining the
    signature, query mapping, converter annotation and every other statement.
  reason: >-
    The method accepts a distinct body argument but sends the query argument
    instead, so the caller's body value never reaches its documented body key.
  evidence: docs/departures/evidence/body-query-parameter-value.md

- id: closed-empty-object-example
  kind: fern-defect
  trigger: >-
    A required argument whose schema is an object closed with
    `additionalProperties: false` that declares no `properties`, and whose
    `patternProperties`, if any, cannot hold a string: its usage example in
    `README.md`, `reference.md` and the method's docstring.
  fern: >-
    The free-form placeholder `{"key": "value"}`, laid out over three lines in
    `README.md` and `reference.md` and on one line in a docstring.
  crozier: >-
    `{}`, on one line, which the schema admits.
  reason: >-
    An example value invalid for its own schema: such an object admits no key
    holding the string `"value"`, so validating `{"key": "value"}` against it
    fails, and a snippet sending it sends a body the API's own schema rejects.
  evidence: docs/departures/evidence/closed-empty-object-example.md

- id: constant-header-docs-arguments
  kind: fern-defect
  trigger: >-
    An operation header whose schema defaults to a string (a plain string or an
    inline string enum, required or not), which the method does not take and
    the request sends as that constant: `README.md` and `reference.md`.
  fern: >-
    Method snippets passing the header as an argument with its default
    (`mist_mode="fine"`), and a `reference.md` parameter block documenting it
    under the method as `typing.Literal`.
  crozier: >-
    Method snippets and parameter lists without it.
  reason: >-
    The examples contradict the generated code: the method has no such
    argument, so the documented call raises `TypeError` for an unexpected
    keyword argument, and `reference.md` documents an argument the method does
    not have.
  evidence: docs/departures/evidence/constant-header-docs-arguments.md

- id: date-header-constructor-example
  kind: fern-defect
  trigger: >-
    A promoted optional date header in a client constructor's Python examples.
  fern: >-
    The constructor receives a YOUR placeholder string despite its dt.date annotation.
  crozier: >-
    The constructor receives datetime.date.fromisoformat("2023-01-15") and the example imports datetime.
  reason: >-
    The placeholder is invalid for the declared date schema. The correction uses the
    certified generator's own date-example form and leaves string placeholders intact.
  evidence: docs/departures/evidence/date-header-constructor-example.md

- id: fern-metadata-generator-config
  kind: provenance
  trigger: >-
    `.fern/metadata.json` at the SDK root, when the reference was generated with
    any generator configuration other than `pydantic_config.enum_type:
    python_enums` alone (crozier's `client-class-name`, `enum-type: literals`,
    `extra-fields` or `default-max-retries`, for example).
  fern: >-
    A `generatorConfig` object recording the configuration Fern's generator ran
    with, or no `generatorConfig` key under Fern's defaults.
  crozier: >-
    The one fixed metadata record crozier always writes, whose `generatorConfig`
    is `pydantic_config.enum_type: python_enums` whatever crozier was configured
    with.
  reason: >-
    The block records how a generator was run, not anything the SDK does;
    crozier ships one fixed provenance record rather than imitating the
    configuration of a Fern run it did not make.
  evidence: docs/departures/evidence/fern-metadata-generator-config.md

- id: init-type-checking-import-order
  kind: ordering
  trigger: >-
    A lazy-loading `__init__.py` whose `if typing.TYPE_CHECKING:` block imports
    from several sources.
  fern: >-
    The block's imports in the order Fern's generator collected them.
  crozier: >-
    The same import statements, in crozier's sorted order.
  reason: >-
    The block exists only for type checkers and is never executed, and the two
    blocks import exactly the same names: sorted with ruff's isort, they are
    identical. crozier emits a deterministic sorted order rather than
    reproducing Fern's collection order.
  evidence: docs/departures/evidence/init-type-checking-import-order.md

- id: lifted-base-path-docs-examples
  kind: fern-defect
  trigger: >-
    A document-level `x-fern-base-path` (or `x-crozier-base-path`) object whose
    `path` names a `{placeholder}`, which the client lifts out of every method
    into a constructor argument: `README.md` and `reference.md`.
  fern: >-
    Method snippets passing the lifted argument (`edition="v2"`) to methods that
    do not take it, a `reference.md` parameter block documenting it under each
    such method, and client constructors that leave it out — even where it is
    required.
  crozier: >-
    Method snippets and parameter lists without it, and every snippet's
    constructor passing it first, by keyword: its default (`edition="v2"`), or
    the `YOUR_EDITION` placeholder Fern's own docstrings use when it has none.
  reason: >-
    The examples contradict the generated code: each method call raises
    `TypeError` for an unexpected keyword argument, a required lifted argument
    left out of the constructor raises `TypeError` for the missing one, and
    `reference.md` documents an argument the method does not have.
  evidence: docs/departures/evidence/lifted-base-path-docs-examples.md

- id: lifted-base-path-positional-example
  kind: fern-defect
  trigger: >-
    A lifted base-path parameter (see `lifted-base-path-docs-examples`) with a
    string `default`: the client constructor examples in the docstrings of the
    root client and every resource client.
  fern: >-
    The default passed positionally, `FernApi("v2",)`.
  crozier: >-
    The default passed by keyword, `FernApi(edition="v2",)`.
  reason: >-
    The generated constructor is keyword-only, so the example call does not
    match its signature: it raises `TypeError` (`takes 1 positional argument but
    2 were given`).
  evidence: docs/departures/evidence/lifted-base-path-positional-example.md

- id: multipart-object-required-file-example
  kind: fern-defect
  trigger: >-
    A multipart method with a required file beside a JSON-encoded object whose
    type is a component alias, or whose argument is named json: its client
    docstring example.
  fern: >-
    A call omitting the required file argument, although the generated method
    requires it. The object encoding and json module alias remain valid.
  crozier: >-
    The same example with that required file placeholder, preserving every
    other argument, the method signature, imports and request encoding.
  reason: >-
    Binding the documented call to the actual generated sync or async method
    raises TypeError for a missing required argument. The correction makes the
    example bind without changing valid generated SDK behavior.
  evidence: docs/departures/evidence/multipart-object-required-file-example.md

- id: nullable-items-docs
  kind: fern-defect
  trigger: >-
    A query parameter whose inline array `items` admit `null` (`nullable: true`,
    or a 3.1 `type` list naming `null`), typed `Optional[Union[T, Sequence[T]]]`
    in the signature: `README.md` and `reference.md`.
  fern: >-
    `reference.md` documenting the parameter as
    `Optional[Union[Optional[T], Sequence[Optional[T]]]]`, and a required one's
    worked call passing `[None]`.
  crozier: >-
    The signature's own type, and the element Fern's worked call passes for the
    same items without `nullable` (`[1]`, `["trays"]`).
  reason: >-
    The docs contradict the generated code: `reference.md` documents a type the
    method's signature does not have, and the documented call passes `None`
    items that the signature's `Sequence[T]` rejects.
  evidence: docs/departures/evidence/nullable-items-docs.md

- id: readme-client-class-casing
  kind: fern-defect
  trigger: >-
    No `client-class-name` set, and an organization (crozier's package name)
    with capitals inside it, such as `LanternHarbor`: `README.md`, and the
    environment snippet of `reference.md`.
  fern: >-
    Snippets naming the root client class, its async twin and its environment
    class with the inner capitals lowered (`LanternharborApi`,
    `AsyncLanternharborApi`, `LanternharborApiEnvironment`), which the package
    does not define.
  crozier: >-
    The class names the package defines (`LanternHarborApi`,
    `AsyncLanternHarborApi`, `LanternHarborApiEnvironment`).
  reason: >-
    An example that imports a class the generated package does not define
    contradicts the generated code: the import fails, so the snippet cannot run.
  evidence: docs/departures/evidence/readme-client-class-casing.md

- id: request-alias-reference-parameters
  kind: fern-defect
  trigger: An aliased object JSON body is flattened into method arguments but reference.md advertises a whole request argument.
  fern: The reference parameter is request with the alias type, although the generated method has no request argument.
  crozier: The reference lists the actual flattened arguments and their types and descriptions; generated code and usage examples remain matched.
  reason: Binding the advertised request argument to the actual generated signature raises an unexpected-keyword error. The correction documents the arguments the method accepts.
  evidence: docs/departures/evidence/request-alias-reference-parameters.md

- id: sdk-identity-header-prefix
  kind: branding
  trigger: >-
    Every SDK: the default headers in `core/client_wrapper.py`.
  fern: >-
    `X-Fern-Language`, `X-Fern-Runtime`, `X-Fern-Platform` and, in the packaged
    layout, `X-Fern-SDK-Name` and `X-Fern-SDK-Version`.
  crozier: >-
    The same headers with the same values, named `X-Crozier-*`.
  reason: >-
    crozier identifies itself to the API it calls rather than impersonating
    Fern's generator.
  evidence: docs/departures/evidence/sdk-identity-header-prefix.md

- id: sdk-name-version-headers
  kind: packaging
  trigger: >-
    The packaged layout's `core/client_wrapper.py`, against a reference whose
    publishing metadata differs from crozier's: one generated without it, or
    published under another name or version.
  fern: >-
    No `X-Fern-SDK-Name` / `X-Fern-SDK-Version` header, or one carrying the
    reference's published distribution name and release version.
  crozier: >-
    `X-Crozier-SDK-Name` naming crozier's project name and
    `X-Crozier-SDK-Version` carrying crozier's fixed packaged version, `0.0.0`.
  reason: >-
    crozier always writes the packaged wrapper's identity pair from its own
    settings; which name and version a reference was published under is
    release metadata outside the generated code.
  evidence: docs/departures/evidence/sdk-name-version-headers.md

- id: sdk-variable-docs-examples
  kind: fern-defect
  trigger: >-
    A path parameter lifted into a required client field by a document SDK
    variable: README.md and reference.md examples and parameter documentation.
  fern: >-
    Constructors omit the required field; method documentation retains the
    lifted parameter and positional placeholder although the method has no
    positional argument.
  crozier: >-
    Constructors pass the lifted field by keyword and method documentation
    follows the generated signature.
  reason: >-
    Constructor examples fail to bind because their required field is missing;
    method examples pass an argument the generated method does not accept.
  evidence: docs/departures/evidence/sdk-variable-docs-examples.md
