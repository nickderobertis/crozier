openapi: 3.0.3
info:
  title: probe
  version: 1.0.0
paths:
  /pets:
    get:
      operationId: getPet
      x-fern-examples:
        - response:
            body:
              pet:
                name: Tom
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pet:
                    $ref: "#/components/schemas/Pet"
components:
  schemas:
    Pet:
      oneOf:
        - $ref: "#/components/schemas/Cat"
        - $ref: "#/components/schemas/Dog"
      discriminator:
        propertyName: kind
        mapping:
          cat: "#/components/schemas/Cat"
          dog: "#/components/schemas/Dog"
    Cat:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
        name:
          type: string
    Dog:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
        name:
          type: string
