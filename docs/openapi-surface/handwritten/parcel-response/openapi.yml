openapi: 3.0.3
info:
  title: Parcel Ledger
  version: 1.0.0
paths:
  /parcel:
    get:
      operationId: read_parcel
      responses:
        '200':
          description: Parcel status
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Parcel'
                - $ref: '#/components/responses/Purged/content/application~1json/schema'
components:
  schemas:
    Parcel:
      type: object
      properties:
        label:
          type: string
  responses:
    Purged:
      description: Removal record
      content:
        application/json:
          schema:
            type: object
            properties:
              removed_at:
                type: string
