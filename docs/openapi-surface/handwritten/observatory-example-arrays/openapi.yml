openapi: 3.1.0
info:
  title: Observatory Readings
  version: 1.0.0
paths:
  /readings:
    post:
      operationId: recordReading
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [observed_days, annotation]
              properties:
                observed_days:
                  type: array
                  items:
                    type: string
                    format: date
                  example: ['2025-04-08', '2025-04-08', '2025-04-09']
                annotation:
                  oneOf:
                    - type: array
                      items:
                        type: string
                    - type: string
                  example:
                    $ref: '#/components/examples/Annotation'
      responses:
        '204':
          description: Recorded.
components:
  examples:
    Annotation:
      value: [clear]
