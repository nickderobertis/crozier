openapi: 3.0.3
info:
  title: http-mutual-unrequired
  version: 1.0.0
servers:
  - url: https://api.example.com
security: []
paths:
  /status:
    get:
      operationId: getStatus
      responses:
        "200":
          description: The service status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
components:
  schemas:
    Status:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
  securitySchemes:
    MutualAuth:
      type: http
      scheme: mutual
