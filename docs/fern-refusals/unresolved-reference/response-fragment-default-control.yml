openapi: 3.0.3
info: {title: Response fragment control, version: '1'}
paths:
  /probe:
    get:
      operationId: probe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {id: {type: string}}}
        default: {$ref: '#/components/responses/Failed'}
components:
  responses:
    Failed:
      description: Failed
      $ref: '#/x-fragment/error'
  schemas:
    Error:
      type: object
      properties:
        message: {type: string}
x-fragment:
  error:
    content:
      application/json:
        schema: {$ref: '#/components/schemas/Error'}
