          }
        ],
        "responses": {
          "200": {
            "description": "Signals",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "type": "string"
                  }
                }
              }
            }
          }
        }
      }
    }
  },
  "x-fern-sdk-variables": {
    "stationCode": {
      "type": "string"
    }
  }
}
