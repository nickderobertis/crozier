# The catalog of crozier's intended departures from Fern's output: every place
# crozier writes something other than what Fern writes, on purpose. It is
# compiled into the binary (src/departures.rs), and every comparison of crozier's
# output with Fern's — `crozier compare` and every golden comparison in the test
# suite — applies it through one engine (src/parity.rs). Each entry's rule, which
# recognises exactly Fern's construct and crozier's replacement in a pair of
# files, is the function of the same id in src/departures.rs.
#
# docs/departures/README.md holds the rendered reference (a drift test keeps it
# equal to this file), what each key holds, the defect rule, and how a fix adds
# an entry. Entries are sorted by `id`.

- id: anyof-path-param-schema-example
  kind: richer-documentation
  trigger: >-
    A path parameter whose schema is an inline anyOf or oneOf composition
    declaring a string schema-level example, a required string query parameter
    with a referenced schema and its own example, or a required property with
    an example beside an allOf reference and description-only annotations,
    or a required property referencing a oneOf component whose declared example
    validates against exactly one supported alternative: the worked examples of README.md, reference.md and each client.py docstring.
  fern: >-
    The parameter's own name as its placeholder value
    (branch_id_or_ref="branch_id_or_ref").
  crozier: >-
    The specification's declared example (branch_id_or_ref="abcdefghijklmnopqrst").
    Every other argument and line is retained.
  reason: >-
    Both calls bind and are valid strings for the parameter's str annotation;
    crozier's passes the value the specification itself declares, where Fern's
    passes a placeholder or an arbitrary first alternative. The rule rejects
    invalid declared union examples and abstains on unsupported assertions.
  evidence: docs/departures/evidence/anyof-path-param-schema-example.md

- id: binary-json-body-example
  kind: fern-defect
  trigger: >-
    An inline application/json binary string body, which the method annotates
    bytes, in its worked example.
  fern: >-
    Sync and async client docstrings, README and reference.md pass
    request="string" to the bytes parameter, which reference.md documents as
    bytes.
  crozier: >-
    Those exact default example values are b"string"; the bytes annotation, the
    reference parameter type and json=request remain matched.
  reason: >-
    Checking the example against the actual generated bytes annotation rejects
    the plain string. The corrected bytes value has the right type and the
    matched SDK wrapper serializes it to JSON.
  evidence: docs/departures/evidence/binary-json-body-example.md

- id: body-query-parameter-value
  kind: fern-defect
  trigger: >-
    An inline JSON body property sharing its wire key with a query parameter,
    where the method signature renames the body argument to avoid the collision.
  fern: >-
    The query parameter's variable as the JSON property's value, including
    inside convert_and_respect_annotation_metadata.
  crozier: >-
    The renamed body argument as the JSON property's value, retaining the
    signature, query mapping, converter annotation and every other statement.
  reason: >-
    The method accepts a distinct body argument but sends the query argument
    instead, so the caller's body value never reaches its documented body key.
  evidence: docs/departures/evidence/body-query-parameter-value.md

- id: closed-empty-object-example
  kind: fern-defect
  trigger: >-
    A required argument whose schema is an object closed with
    `additionalProperties: false` that declares no `properties`, and whose
    `patternProperties`, if any, cannot hold a string: its usage example in
    `README.md`, `reference.md` and the method's docstring.
  fern: >-
    The free-form placeholder `{"key": "value"}`, laid out over three lines in
    `README.md` and `reference.md` and on one line in a docstring.
  crozier: >-
    `{}`, on one line, which the schema admits.
  reason: >-
    An example value invalid for its own schema: such an object admits no key
    holding the string `"value"`, so validating `{"key": "value"}` against it
    fails, and a snippet sending it sends a body the API's own schema rejects.
  evidence: docs/departures/evidence/closed-empty-object-example.md

- id: collapsed-anyof-property-description
  kind: richer-documentation
  trigger: >-
    An object property declaring a description beside an anyOf or oneOf of two
    or more inline non-null scalar alternatives, the first undescribed, which
    both sides type as the one scalar they share: its model field, its client.py
    and raw_client.py docstring parameter entry, and its reference.md row.
  fern: >-
    The property undocumented: the bare model field (assistant_id: str), a
    docstring entry with no description, and a reference.md row with no text
    after its type.
  crozier: >-
    The property's description: the model field declared with pydantic.Field()
    and a docstring holding it, the docstring entry's description line, and the
    reference.md row's em-dash description. The type, the field's requiredness
    and every other line are retained.
  reason: >-
    Both outputs type and validate the field identically; crozier's documents
    the description the specification declares on the property itself, where
    Fern's documents nothing about it.
  evidence: docs/departures/evidence/collapsed-anyof-property-description.md

- id: constant-header-docs-arguments
  kind: fern-defect
  trigger: >-
    An operation header whose schema defaults to a string (a plain string or an
    inline string enum, required or not), which the method does not take and
    the request sends as that constant: `reference.md`.
  fern: >-
    A parameter block documenting the header under the method as an argument
    typed `typing.Literal` (`mist_mode`), although its worked call, like
    README.md's, leaves the header out.
  crozier: >-
    The method's parameter list without it.
  reason: >-
    The docs contradict the generated code: `reference.md` documents an
    argument the method does not have, and passing it as documented raises
    `TypeError` for an unexpected keyword argument.
  evidence: docs/departures/evidence/constant-header-docs-arguments.md

- id: date-header-constructor-example
  kind: fern-defect
  trigger: >-
    A promoted optional date header in a client constructor's Python examples.
  fern: >-
    The constructor receives a YOUR placeholder string despite its dt.date annotation.
  crozier: >-
    The constructor receives datetime.date.fromisoformat("2023-01-15") and the example imports datetime.
  reason: >-
    The placeholder is invalid for the declared date schema. The correction uses the
    certified generator's own date-example form and leaves string placeholders intact.
  evidence: docs/departures/evidence/date-header-constructor-example.md

- id: digit-leading-method-reference-identifiers
  kind: fern-defect
  trigger: >-
    An operationId starts with an ASCII digit, and a generated method with its
    identifier-safe underscore prefix exists: README.md and reference.md only.
  fern: >-
    The digit-leading method spelling without the underscore, in README calls
    and reference headings, although the generated method has the underscore.
  crozier: >-
    The identifier the generated SDK defines, retaining every other byte of the line.
  reason: >-
    The documented call fails Python compilation with an invalid decimal literal
    and contradicts the generated SDK method, which imports and binds correctly.
  evidence: docs/departures/evidence/digit-leading-method-reference-identifiers.md

- id: docstring-literal-dollar-escape
  kind: fern-defect
  trigger: >-
    A required request property declared as a string `const` holding `$`,
    lowered to a one-value literal under Fern's default literals enum type: the
    client docstring examples that pass it.
  fern: >-
    The literal with an escaped backslash before every `$`, `"\\$PS1"` for the
    const `$PS1`, while its own README and reference.md pass `"$PS1"`.
  crozier: >-
    The const's own value, `"$PS1"`, as Fern's README and reference.md write it.
    Every other docstring line, the annotation and the request are retained.
  reason: >-
    Evaluating the documented example yields `\$PS1`, a value the const does
    not admit, and the docstring contradicts Fern's own Markdown examples. The
    correction passes the only value the schema admits.
  evidence: docs/departures/evidence/docstring-literal-dollar-escape.md

- id: emoji-tag-reference-identifiers
  kind: fern-defect
  trigger: >-
    A tag whose name holds a character no Python identifier admits, such as an
    emoji (⚠️ Not supported yet), which both sides' generated packages name by
    an identifier-safe module (not_supported_yet): the client calls, source
    links and imports of README.md and reference.md.
  fern: >-
    The tag's raw spelling in each (client.⚠️_not_supported_yet.get_orders(...),
    src/fern/⚠️_not_supported_yet/client.py, from fern.⚠️_not_supported_yet
    import ...), although its own package names the module not_supported_yet.
  crozier: >-
    The identifier the generated package defines (client.not_supported_yet,
    src/fern/not_supported_yet/client.py, from fern.not_supported_yet import
    ...), with every other character of each line retained.
  reason: >-
    The examples contradict the generated code: Python rejects the documented
    call with a SyntaxError for the invalid character before anything runs, the
    linked file does not exist, and no such module can be imported.
  evidence: docs/departures/evidence/emoji-tag-reference-identifiers.md

- id: empty-namespace-package
  kind: fern-defect
  trigger: >-
    Operations Fern groups under the empty namespace it calls `_`: tagged only
    with the empty string, or an `operationId` with an empty dotted prefix
    (`.GetThing`).
  fern: >-
    The `_` package's files written at the package root rather than under
    `_/`: the root `client.py`, `raw_client.py` and `__init__.py` are the `_`
    sub-client's and its package marker (importing `..core` from above the
    package), its hoisted types sit in the root `types/`, the root client is
    lost, and docstring examples call `client..method()`; `README.md` and
    `reference.md` call `client._.method()` and link `src/<package>/_/client.py`.
  crozier: >-
    The same `_` package under `_/` (its `client.py` but for its examples,
    `raw_client.py`, `__init__.py` and `types/` files Fern's root copies), the
    root `client.py` and `__init__.py` the root client and package exporting
    it with a `_` property, and examples calling `client._.method()`.
  reason: >-
    The tree cannot be imported: the root package exports no client and its
    `client.py` imports from above the top-level package, so the documented
    `from <package> import <Client>` and `client._.method()` raise
    `ImportError`.
  evidence: docs/departures/evidence/empty-namespace-package.md

- id: empty-root-security-optional-credential
  kind: usefulness
  trigger: >-
    A document whose root `security` is the empty list, with operations that
    declare no `security` of their own beside operations that require a
    credential and none whose own `security` is empty: the root `client.py` and
    `core/client_wrapper.py`.
  fern: >-
    The credential required, `api_key: str` in each constructor and its
    docstring, and its header set unconditionally.
  crozier: >-
    The credential optional, `api_key: typing.Optional[str] = None`, and its
    header set only when a value was given.
  reason: >-
    An empty root `security` list means what an absent one does: every
    operation without its own `security` needs no credential. The certified
    pair already makes the credential optional for the absent spelling, and
    crozier reads both spellings alike, so an SDK user can call the
    unauthenticated operations without inventing a key.
  evidence: docs/departures/evidence/empty-root-security-optional-credential.md

- id: fern-metadata-generator-config
  kind: provenance
  trigger: >-
    `.fern/metadata.json` at the SDK root, when the reference was generated with
    any generator configuration other than `pydantic_config.enum_type:
    python_enums` alone (crozier's `client-class-name`, `enum-type: literals`,
    `extra-fields` or `default-max-retries`, for example).
  fern: >-
    A `generatorConfig` object recording the configuration Fern's generator ran
    with, or no `generatorConfig` key under Fern's defaults.
  crozier: >-
    The one fixed metadata record crozier always writes, whose `generatorConfig`
    is `pydantic_config.enum_type: python_enums` whatever crozier was configured
    with.
  reason: >-
    The block records how a generator was run, not anything the SDK does;
    crozier ships one fixed provenance record rather than imitating the
    configuration of a Fern run it did not make.
  evidence: docs/departures/evidence/fern-metadata-generator-config.md

- id: init-type-checking-import-order
  kind: ordering
  trigger: >-
    A lazy-loading `__init__.py` whose `if typing.TYPE_CHECKING:` block imports
    from several sources, including a root package whose tag subpackages
    re-export their hoisted types.
  fern: >-
    The block's imports in the order Fern's generator collected them, the root
    client's and environment's statements sorted by module among the tag
    subpackages'.
  crozier: >-
    The same import statements, in crozier's sorted order, the root client's
    and environment's statements ahead of every tag subpackage's.
  reason: >-
    The block exists only for type checkers and is never executed, and the
    reordered statements import exactly the same names: sorted with ruff's
    isort, the two blocks are identical, or, where they differ in another way,
    the window of statements that moves is one permutation of identical
    statements and every other difference in the block remains a difference.
    crozier emits a deterministic sorted order rather than reproducing Fern's
    collection order.
  evidence: docs/departures/evidence/init-type-checking-import-order.md

- id: int64-example-rounded-out-of-range
  kind: fern-defect
  trigger: >-
    An integer example of a `format: int64` property, array item or parameter
    whose nearest double lies outside the signed 64-bit range
    (`9223372036854775807`, `-9223372036854775808`): the README, reference.md and
    client docstring examples that pass it.
  fern: >-
    The double's JavaScript spelling, `9223372036854776000` or
    `-9223372036854776000`, outside the int64 range.
  crozier: >-
    The declared example exactly. An example whose rounding stays inside the
    range keeps Fern's rounded spelling.
  reason: >-
    Validating the documented value against the property's declared int64
    bounds rejects Fern's value; the declared example is a valid int64 and
    satisfies them.
  evidence: docs/departures/evidence/int64-example-rounded-out-of-range.md

- id: lifted-base-path-docs-examples
  kind: fern-defect
  trigger: >-
    A document-level `x-fern-base-path` (or `x-crozier-base-path`) object whose
    `path` names a `{placeholder}`, which the client lifts out of every method
    into a constructor argument: `README.md` and `reference.md`.
  fern: >-
    Method snippets passing the lifted argument (`edition="v2"`) to methods that
    do not take it, a `reference.md` parameter block documenting it under each
    such method, and client constructors that leave it out — even where it is
    required.
  crozier: >-
    Method snippets and parameter lists without it, and every snippet's
    constructor passing it first, by keyword: its default (`edition="v2"`), or
    the `YOUR_EDITION` placeholder Fern's own docstrings use when it has none.
  reason: >-
    The examples contradict the generated code: each method call raises
    `TypeError` for an unexpected keyword argument, a required lifted argument
    left out of the constructor raises `TypeError` for the missing one, and
    `reference.md` documents an argument the method does not have.
  evidence: docs/departures/evidence/lifted-base-path-docs-examples.md

- id: multipart-object-required-file-example
  kind: fern-defect
  trigger: >-
    A multipart method with a required file part, with or without a
    JSON-encoded object part beside it: its client docstring example.
  fern: >-
    A call omitting the required file argument, although the generated method
    requires it. The object encoding and json module alias remain valid.
  crozier: >-
    The same example with that required file's placeholder in the form Fern's
    README uses (`image="example_image"`), preserving every other argument, the
    method signature, imports and request encoding.
  reason: >-
    Binding the documented call to the actual generated sync or async method
    raises TypeError for a missing required argument. The correction makes the
    example bind without changing valid generated SDK behavior.
  evidence: docs/departures/evidence/multipart-object-required-file-example.md

- id: nested-discriminator-flat-wire
  kind: fern-defect
  trigger: >-
    A discriminated union mapping to another discriminated union, whose public
    variant holds the inner union in value.
  fern: >-
    Serializes a kind/value envelope that fails the source schema, rejects the
    schema-valid flat provider payload for missing value, and writes an empty
    argument in the README and reference examples.
  crozier: >-
    Retains Fern's public classes, fields and value constructors, flattens the
    wire payload and parses flat responses under Pydantic v1 and v2. Worked
    examples construct the inner variant through value.
  reason: >-
    The certified SDK cannot exchange the payload its own OpenAPI document
    declares. Runtime schema validation demonstrates the serialization failure
    and the rejection of a valid provider response in both Pydantic majors.
  evidence: docs/departures/evidence/nested-discriminator-flat-wire.md

- id: nullable-items-docs
  kind: fern-defect
  trigger: >-
    A query parameter whose inline array `items` admit `null` (`nullable: true`,
    or a 3.1 `type` list naming `null`), typed `Optional[Union[T, Sequence[T]]]`
    in the signature: `README.md` and `reference.md`.
  fern: >-
    `reference.md` documenting the parameter as
    `Optional[Union[Optional[T], Sequence[Optional[T]]]]`, and a required one's
    worked call passing `[None]`.
  crozier: >-
    The signature's own type, and the element Fern's worked call passes for the
    same items without `nullable` (`[1]`, `["trays"]`).
  reason: >-
    The docs contradict the generated code: `reference.md` documents a type the
    method's signature does not have, and the documented call passes `None`
    items that the signature's `Sequence[T]` rejects.
  evidence: docs/departures/evidence/nullable-items-docs.md

- id: optional-lowered-required-query-array-example
  kind: richer-documentation
  trigger: >-
    A required query array parameter, which both signatures take as an
    optional argument, whose parameter or schema declares an array example, on
    an operation whose worked example Fern writes without required query arrays
    (a text/* success body, or a required query parameter exampled as an
    object or map): the worked examples of README.md, reference.md and each
    client.py docstring.
  fern: The call without the parameter.
  crozier: >-
    The call passing the declared example (channels=[1.0, 2.0] in a docstring,
    wrapped one item per line in reference.md). A parameter declaring no
    example is left out, as Fern leaves it.
  reason: >-
    Both calls bind, since the argument is optional in both signatures;
    crozier's passes the value the specification declares for a parameter it
    marks required, and that value is valid for the array schema, where Fern's
    leaves the required input out of the example.
  evidence: docs/departures/evidence/optional-lowered-required-query-array-example.md

- id: pattern-narrowed-enum-example
  kind: fern-defect
  trigger: >-
    A string enum reference intersected with a scalar string pattern, whose first
    declared enum value is rejected by that pattern, in a generated default
    usage example. The comparison has the parsed source document.
  fern: >-
    The first enum member, or its literal string, as the example argument.
  crozier: >-
    The first declared enum value valid against the complete schema it
    documents: the enum, the scalar member and the enclosing schema's own
    constraints. Where no value is valid, or a constraint cannot be decided,
    Fern's example stands. The enum alias, annotation, description and all
    other output are retained.
  reason: >-
    Validating Fern's generated example value against the property's allOf
    schema rejects it; the replacement satisfies every constraint of it.
  evidence: docs/departures/evidence/pattern-narrowed-enum-example.md

- id: readme-client-class-casing
  kind: fern-defect
  trigger: >-
    No `client-class-name` set, and an organization (crozier's package name)
    with capitals inside it, such as `LanternHarbor`: `README.md`, and the
    environment snippet of `reference.md`.
  fern: >-
    Snippets naming the root client class, its async twin and its environment
    class with the inner capitals lowered (`LanternharborApi`,
    `AsyncLanternharborApi`, `LanternharborApiEnvironment`), which the package
    does not define.
  crozier: >-
    The class names the package defines (`LanternHarborApi`,
    `AsyncLanternHarborApi`, `LanternHarborApiEnvironment`).
  reason: >-
    An example that imports a class the generated package does not define
    contradicts the generated code: the import fails, so the snippet cannot run.
  evidence: docs/departures/evidence/readme-client-class-casing.md

- id: repeated-credential-example-keyword
  kind: fern-defect
  trigger: >-
    Two credentials that resolve to one constructor parameter: two header
    `apiKey` schemes naming the same `X-Api-Key` header, two whose headers
    stem to one name (`X-API-KEY` and `API-KEY`), or a bearer scheme whose
    `x-fern-token-variable-name` is `apiKey` beside such a header scheme:
    `README.md`, `reference.md` and every `client.py`.
  fern: >-
    Client constructor examples passing the shared keyword twice
    (`FernApi(api_key="YOUR_API_KEY", api_key="YOUR_API_KEY", ...)`).
  crozier: >-
    The keyword once, as the constructor declares it.
  reason: >-
    A call repeating a keyword argument does not bind: Python rejects it as a
    `SyntaxError` before the example runs, so the documented client cannot be
    built as written.
  evidence: docs/departures/evidence/repeated-credential-example-keyword.md

- id: request-alias-reference-parameters
  kind: fern-defect
  trigger: An aliased object JSON body is flattened into method arguments but reference.md advertises a whole request argument.
  fern: The reference parameter is request with the alias type, although the generated method has no request argument.
  crozier: The reference lists the actual flattened arguments and their types and descriptions; generated code and usage examples remain matched.
  reason: Binding the advertised request argument to the actual generated signature raises an unexpected-keyword error. The correction documents the arguments the method accepts.
  evidence: docs/departures/evidence/request-alias-reference-parameters.md

- id: schema-rejected-array-length-example
  kind: fern-defect
  trigger: >-
    A list in a worked example of `README.md`, `reference.md` or a generated
    client's docstring that Fern writes with its fixed number of items (one, or
    two in its fallback example writer), whose schema's `minItems` or
    `maxItems` rejects that count. The comparison has the parsed source
    document.
  fern: >-
    The list with Fern's fixed number of items (discord's
    `messages=["messages"]` beneath `minItems: 2`).
  crozier: >-
    The specification's own declared example for that schema when the schema
    accepts it, else its declared `default` when the schema accepts it, else
    Fern's items cut to `maxItems` or padded to `minItems` with copies of the
    first item, or, beneath `uniqueItems: true`, with pairwise-distinct items
    the item schema accepts. Where no such items can be built, or Fern writes
    the list empty and has no item to copy, Fern's value stays. The argument,
    its place and every other line are unchanged.
  reason: >-
    An example value invalid for its own schema is a defect under the defect
    rule: the API rejects the call the example shows. Validating Fern's value
    against its source schema rejects it; crozier's is accepted.
  evidence: docs/departures/evidence/schema-rejected-array-length-example.md

- id: schema-rejected-name-example
  kind: fern-defect
  trigger: >-
    A string parameter or property, in a worked example of `README.md`,
    `reference.md` or a generated client's docstring, whose schema declares no
    example Fern uses and rejects the parameter's or property's own name by a
    `pattern`, `minLength`, `maxLength`, `enum`, `const` or a `date`,
    `date-time`, `time`, `uuid`, `email`, `uri`, `ipv4`, `ipv6` or `hostname`
    `format`. The comparison has the parsed source document.
  fern: >-
    The name as the value (discord's `guild_id="guild_id"` beneath
    `pattern: ^(0|[1-9][0-9]*)$`).
  crozier: >-
    The specification's own declared example for that schema when the
    schema accepts it, else its declared `default` when the schema accepts it,
    else a value constructed deterministically to satisfy every in-scope
    keyword. Where no such value exists or crozier cannot decide validity,
    Fern's value stays. The argument, its place and every other line are
    unchanged.
  reason: >-
    An example value invalid for its own schema is a defect under the defect
    rule: the API rejects the call the example shows. Validating Fern's value
    against its source schema rejects it; crozier's is accepted.
  evidence: docs/departures/evidence/schema-rejected-name-example.md

- id: schema-rejected-number-example
  kind: fern-defect
  trigger: >-
    An integer or number parameter or property, in a worked example of
    `README.md`, `reference.md` or a generated client's docstring, whose schema
    rejects Fern's fixed placeholder (`1`, `1000000` or `1.1`) by an `enum`,
    `const`, `minimum`, `maximum`, `exclusiveMinimum`, `exclusiveMaximum`,
    `multipleOf` or the `int32` or `int64` range. The comparison has the parsed
    source document.
  fern: >-
    The fixed placeholder as the value (discord's `trigger_type=1` beneath
    `enum: [4]`).
  crozier: >-
    The specification's own declared example for that schema when the
    schema accepts it, else its declared `default` when the schema accepts it,
    else a value constructed deterministically to satisfy every in-scope
    keyword. Where no such value exists or crozier cannot decide validity,
    Fern's value stays. The argument, its place and every other line are
    unchanged.
  reason: >-
    An example value invalid for its own schema is a defect under the defect
    rule: the API rejects the call the example shows. Validating Fern's value
    against its source schema rejects it; crozier's is accepted.
  evidence: docs/departures/evidence/schema-rejected-number-example.md

- id: schema-rejected-placeholder-string-example
  kind: fern-defect
  trigger: >-
    A string in a worked example of `README.md`, `reference.md` or a
    generated client's docstring that Fern writes as its fixed `"string"` or
    `"value"` placeholder, whose schema rejects that placeholder by an in-scope
    keyword or format. The comparison has the parsed source document.
  fern: >-
    The fixed placeholder `"string"` or `"value"` as the value.
  crozier: >-
    The specification's own declared example for that schema when the
    schema accepts it, else its declared `default` when the schema accepts it,
    else a value constructed deterministically to satisfy every in-scope
    keyword. Where no such value exists or crozier cannot decide validity,
    Fern's value stays. The argument, its place and every other line are
    unchanged.
  reason: >-
    An example value invalid for its own schema is a defect under the defect
    rule: the API rejects the call the example shows. Validating Fern's value
    against its source schema rejects it; crozier's is accepted.
