# The `python-workspace` Nx project's uv workspace member (the workspace is
# declared in the root pyproject.toml). It publishes nothing: there is no
# [build-system], and `package = false` keeps uv from trying to build or
# install it.
[project]
name = "crozier-python-workspace"
version = "0.0.0"
description = "The Python tooling's combined coverage floor and the workspace's own drift checks."
requires-python = ">=3.11"
dependencies = ["coverage>=7.16"]

[tool.uv]
package = false
