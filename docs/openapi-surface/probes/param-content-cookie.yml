openapi: 3.0.3
info:
  title: param-content-cookie
  version: 1.0.0
servers:
- url: https://probe.invalid
paths:
  /probe:
    get:
      operationId: probe
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeResult'
      parameters:
      - name: probeParam
        in: cookie
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                part:
                  type: string
components:
  schemas:
    ProbeResult:
      type: object
      properties:
        ok:
          type: boolean
      required:
      - ok
