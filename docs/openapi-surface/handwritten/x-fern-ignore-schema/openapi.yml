openapi: 3.0.3
info:
  title: x-fern-ignore-schema
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /widgets/{widgetId}:
    get:
      operationId: getWidget
      parameters:
        - name: widgetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The widget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Widget"
components:
  schemas:
    Widget:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
    LegacyWidget:
      x-fern-ignore: true
      type: object
      properties:
        id:
          type: string
        part:
          $ref: "#/components/schemas/LegacyPart"
    LegacyPart:
      type: object
      properties:
        serial:
          type: string
