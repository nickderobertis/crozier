# Prove the artifact from a clean checkout: bootstrap, then the gate, on the real
# platform matrix. Every gate job runs `just ci-check`, which picks the tier the
# event owes (tools/ci/ci-tier.mjs): the broader tier (`check --sweep`) on the
# release-plz release pull request, the affected tier against an explicitly
# derived base on every other pull request and on a push to main. Each job scopes
# it to the projects its runner holds the toolchain for. See AGENTS.md.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    # The default types plus `ready_for_review`: a draft lifted to ready must
    # re-report the required contexts on its head, not lean on draft-time runs.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Enable Git long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      # Full history: the affected tier's base is a merge base or the commit a
      # push replaced, and either must be in the checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install just
        uses: extractions/setup-just@v2

      # Nx, the orchestrator the gate runs through, is pinned in bun.lock; bootstrap
      # installs it with bun, on Node.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # rustup honors rust-toolchain.toml (channel + components) on first cargo
      # use, so the pinned toolchain is the single source of truth. Pre-install
      # the dev cargo subcommands as fast prebuilt binaries so `just bootstrap`
      # finds them and skips building from source.
      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov,cargo-deny,cargo-machete

      # Bootstrap installs the pinned `ruff` too (a generation-time dependency —
      # crozier defers Python wrapping to `ruff format`); see
      # scripts/install-ruff.sh and the `.ruff-version` source of truth.
      - name: Bootstrap
        run: just bootstrap

      # Every project but the promoted tiers, which run in the jobs below.
      - name: Check
        env:
          CROZIER_PUSH_BEFORE: ${{ github.event.before }}
        run: just ci-check --exclude=tag:tier:promoted

  # The SDK Python-environment tier, SEPARATE from the offline `just check`: the
  # e2e journeys that build a generated SDK's virtualenv from PyPI and run mypy or
  # pytest in it (the runtime wire suite, the own-pin type-check, the shared env's
  # concurrent build, and the fern-refusals gate's `wire_test.py` condition). Same
  # OS matrix as `check`, since the env and mypy-cache locking are per-platform.
  # llmlint: ignore[external_service_suite_stays_out_of_the_affected_tier] This tier is out of the offline `check` by design, and gating merges on it is a stated requirement: the fern-refusals contract has a `generate` class's wire_test.py block the merge, and branch protection requires only `gate`, so a separate workflow could not gate. It installs only a generated SDK's declared pins from public PyPI with no credential, as the live-e2e leg already gated here does with uv and the corpus fetch.
  sdk-env:
    name: sdk-env (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Enable Git long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install just
        uses: extractions/setup-just@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov,cargo-deny,cargo-machete
      # uv builds the SDK venvs in seconds; without it the journeys fall back to
      # venv + pip.
      - uses: astral-sh/setup-uv@v8.3.2
      - name: Bootstrap
        run: just bootstrap
      # The `sdk-env` and `runtime` projects, when the change reaches them (every
      # time, on the release pull request).
      - name: SDK Python-environment tier
        env:
          CROZIER_PUSH_BEFORE: ${{ github.event.before }}
        run: just ci-check --projects=sdk-env,runtime

  # Single stable required-status context aggregating the matrix, so branch
  # protection lists one `gate` name instead of every per-OS leg. Fails unless
  # every gate + install leg succeeded (a skipped/failed `needs` is not success).
  gate:
    name: gate
    # llmlint: ignore[external_service_suite_stays_out_of_the_affected_tier] This tier is out of the offline `check` by design, and gating merges on it is a stated requirement: the fern-refusals contract has a `generate` class's wire_test.py block the merge, and branch protection requires only `gate`, so a separate workflow could not gate. It installs only a generated SDK's declared pins from public PyPI with no credential, as the live-e2e leg already gated here does with uv and the corpus fetch.
    needs: [check, sdk-env, install, package, live-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # llmlint: ignore[external_service_suite_stays_out_of_the_affected_tier] This tier is out of the offline `check` by design, and gating merges on it is a stated requirement: the fern-refusals contract has a `generate` class's wire_test.py block the merge, and branch protection requires only `gate`, so a separate workflow could not gate. It installs only a generated SDK's declared pins from public PyPI with no credential, as the live-e2e leg already gated here does with uv and the corpus fetch.
      - name: Require all gate jobs to have succeeded
        run: |
          if [ "${{ needs.check.result }}" != "success" ] || [ "${{ needs.sdk-env.result }}" != "success" ] || [ "${{ needs.install.result }}" != "success" ] || [ "${{ needs.package.result }}" != "success" ] || [ "${{ needs.live-e2e.result }}" != "success" ]; then
            echo "::error::a required gate job did not succeed (check=${{ needs.check.result }}, sdk-env=${{ needs.sdk-env.result }}, install=${{ needs.install.result }}, package=${{ needs.package.result }}, live-e2e=${{ needs.live-e2e.result }})" >&2
            exit 1
          fi

  # Live runtime e2e, SEPARATE from `just check` so the core gate stays Node-free:
  # boot a Prism OpenAPI mock server from each fixture's spec and drive the generated
  # SDK through every documented endpoint, asserting a value of the method's declared
  # return type comes back over real HTTP. Complements the byte-diff e2e (source) and
  # the wire tests (request/response shaping vs Fern). Linux-only, like supply-chain.
  live-e2e:
    name: live-e2e
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v2
      # Prism (the mock server) is a Node CLI; install the pinned version globally so
      # `prism` is on PATH (conftest prefers it over an `npx` fetch). The version is
      # single-sourced from tests/live_e2e/conftest.py:PRISM_PKG — read it out here so
      # the pin can never drift between the workflow and the suite.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install Nx (bun.lock)
        run: just install-nx
      - run: npm install -g "$(grep -oP '^PRISM_PKG = "\K[^"]+' tests/live_e2e/conftest.py)"
      # uv backs the test venv (httpx/pydantic/pytest/pyyaml) and the ruff install.
      - uses: astral-sh/setup-uv@v8.3.2
      # ruff is crozier's generation-time dependency (it shells out to `ruff format`);
      # install-ruff.sh pins it and exposes ~/.local/bin on PATH for later steps.
      - name: Install ruff
        run: ./scripts/install-ruff.sh
      # cargo is preinstalled and honors rust-toolchain.toml on first use. The
      # `live-e2e` project builds the release binary its suite drives; `corpus-match`
      # byte-compares against Fern from committed sources (and proves it with sockets
      # denied and no cache); `census-fallback` holds the parser fallback to the
      # pinned ruamel.yaml; `screenshots` tests the demo renderer with Pillow from
      # PyPI. Each runs when the change reaches it, and on the release pull request
      # always.
      # llmlint: ignore[no_second_broader_sweep_over_an_already_gated_commit] The corpus-match offline proof requires a real recipe run with sockets denied and no cache. The normal check cannot prove absence of network dependencies; this distinct environment proof deliberately repeats byte comparison.
      # llmlint: ignore[external_service_suite_stays_out_of_the_affected_tier] The census-fallback tier needs uv to install the pinned ruamel.yaml, so it runs in this separate leg rather than the check matrix; it reads only committed specifications and loopback servers.
      - name: Live e2e, corpus byte-match, census fallback and screenshot renderer
        env:
          CROZIER_PUSH_BEFORE: ${{ github.event.before }}
        run: just ci-check --projects=live-e2e,corpus-match,census-fallback,screenshots

  # Prove the PUBLISHED crate builds: `cargo publish --dry-run` packages the crate
  # (honoring Cargo.toml's `include`) and compiles from that tarball. This is the
  # only check that catches an include-list gap — e.g. an `include_str!` asset dir
  # left unshipped — which otherwise stays green everywhere (source builds see the
  # full tree) and only breaks the real publish-crate job at release time.
  package:
    name: package
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cargo is preinstalled and honors rust-toolchain.toml on first use (as the
      # install job and the release crate jobs do); no explicit toolchain step.
      - name: Verify the published crate tarball builds
        run: cargo publish --dry-run --locked

  # Prove the end-user install path (cargo install) and smoke-test the installed
  # binary — separate from the dev bootstrap. This is the path the README tells
  # users to run.
  install:
    name: install (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Enable Git long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4
      - name: Install crozier (recommended end-user method)
        run: cargo install --path . --locked
      - name: Smoke-test the installed binary
        run: crozier --version

  # PR-title lint: under squash-merge the PR title becomes the release-driving
  # commit, so it must be a valid Conventional Commit. Required check.
  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # LLM-judge tier (llmlint) — a blocking PR check, SEPARATE from `just check`.
  # Non-deterministic and harness-backed, so it never runs inside the gate. Scoped
  # to the merge-base diff. It REQUIRES its credential and fails fast without it;
  # fork PRs are gated by the repo's require-approval-for-fork-workflows setting.
  # The rule plugins are vendored in the tree (llmlint-plugins/), so this job
  # resolves them with no job-time fetch to flake; docs/llmlint-plugins.md.
  llmlint:
    name: llmlint
    if: github.event_name == 'pull_request' && github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Fetch main (diff base)
        run: git fetch --no-tags --depth=2147483647 origin main
      - uses: extractions/setup-just@v2
      # setup-llmlint.sh installs the llmlint toolchain via `uv tool`; uv is not
      # preinstalled on GitHub runners, so provide it before that step runs.
      - uses: astral-sh/setup-uv@v8.3.2
      # llmlint.yml pins no harness; the committed fallback oneharness.toml tries
      # codex, which is not on the runner, then claude-code. The `claude` binary
      # is not on the runner either, so install it; it authenticates from
      # CLAUDE_CODE_OAUTH_TOKEN below.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - name: Install oneharness + llmlint
        run: |
          ./scripts/setup-llmlint.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # The suite below is an Nx target (llmlint-tooling:test-plugins).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install Nx (bun.lock)
        run: just install-nx
      # Prove the rule set still resolves with its origin unreachable — the exact
      # failure that used to fail this required check on a flaked connection.
      # CROZIER_REQUIRE_LLMLINT turns the "llmlint absent" skip into a failure,
      # so this step cannot silently no-op on the one runner that has the binary.
      - name: Plugin-resolution boundary tests
        env:
          CROZIER_REQUIRE_LLMLINT: "1"
        run: just test-llmlint-plugins
      - name: Validate llmlint config
        run: just lint-llm-validate --diff-base origin/main
      - name: Lint changed files
        env:
          # oneharness drives the `claude` CLI, which reads CLAUDE_CODE_OAUTH_TOKEN
          # from the environment for non-interactive auth. Sync it (and the
          # publishing tokens) from Bitwarden with `gh-secrets sync`; see gh-secrets.json.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::llmlint needs a Claude Code credential. Add CLAUDE_CODE_OAUTH_TOKEN" \
                 "(Settings → Secrets and variables → Actions; sync it via gh-secrets). Fork PRs" \
                 "are gated by the require-approval-for-fork-workflows setting; see AGENTS.md." >&2
            exit 1
          fi
          just lint-llm-diff origin/main
