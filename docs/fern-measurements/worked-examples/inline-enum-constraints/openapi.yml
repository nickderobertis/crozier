openapi: 3.0.3
info:
  title: Canal Locks
  version: 1.0.0
paths:
  /passages:
    post:
      operationId: book_passage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Passage'
      responses:
        '204':
          description: Booked
  /moorings:
    post:
      operationId: book_mooring
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - berth
              - tide
              properties:
                berth:
                  type: string
                tide:
                  type: string
                  enum:
                  - slack
                  - flood
                  - ebb
                  - neap
                  pattern: ^(?!slack$).*$
                  maxLength: 4
      responses:
        '204':
          description: Moored
components:
  schemas:
    Passage:
      type: object
      required:
      - vessel
      - window
      - gate
      - lane
      - side
      - pilot
      properties:
        vessel:
          type: string
        gate:
          type: string
          description: Its own `not` rejects the first member.
          enum:
          - upper
          - lower
          not:
            enum:
            - upper
        lane:
          type: string
          description: The first member already satisfies the pattern.
          enum:
          - east
          - west
          pattern: ^e
        side:
          type: string
          description: No member satisfies the pattern, so the first stands.
          enum:
          - port
          - starboard
          pattern: ^x
        pilot:
          type: string
          description: A format no member is decided against, so the first stands.
          enum:
          - harbour
          - sea
          format: email
        window:
          type: string
          description: Locks never open at slack water.
          enum:
          - slack
          - flood
          - ebb
          - neap
          pattern: ^(?!slack$).*$
          minLength: 3
          maxLength: 4
