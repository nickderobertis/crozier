# The `surface-reach` Nx project's uv workspace member (the workspace is declared in
# the root pyproject.toml). It publishes nothing: there is no [build-system],
# and `package = false` keeps uv from trying to build or install it.
[project]
name = "crozier-surface-reach"
version = "0.0.0"
description = "Suites measuring what the goldens reach in src/."
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false
