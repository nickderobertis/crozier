# This repository's warm-pool maintenance, declared for onevcs. onevcs pool
# maintenance reads this file from the publication checkout of the base branch
# (never from a session's branch) and runs `command` in each idle pool slot's
# worktree, never in a slot a session holds; without it this repository's slots
# are never maintained.
#
# The command is the justfile's `pool-maintenance` recipe: cargo-prune-superseded
# over every cargo target dir in the clone, removing each unit's superseded builds
# (in deps/, .fingerprint/, build/ and incremental/) older than 2 days and keeping
# each unit's newest build plus every build modified within those 2 days, so
# rebuilds stay warm. How long one pass takes is the
# `crozier-pool-maintenance-seconds` budget in pool-maintenance/budgets.yaml.
schema_version = 1

[pool.maintain]
command = ["just", "pool-maintenance"]
timeout = "30m"
