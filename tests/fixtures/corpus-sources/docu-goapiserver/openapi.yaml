          in: query
          required: false
          description: 'Students view only: a year from 2024 through the current year, or all (case-insensitive).
            Defaults to the current year.'
          schema:
            type: string
        - name: query
          in: query
          required: false
          description: 'Students view only: student search text.'
          schema:
            type: string
        - name: withdrew_only
          in: query
          required: false
          description: 'Students view only: restrict to withdrawals in the same year. Accepts true/1 and
            false/0, case-insensitive.'
          schema:
            type: boolean
            default: false
        - name: sort_by
          in: query
          required: false
          description: 'Students view only: sort column with _asc/_desc.'
