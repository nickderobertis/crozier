openapi: 3.1.0
info:
  title: Parcel tracker
  version: 1.0.0
paths:
  /parcels:
    post:
      operationId: createParcel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParcelInput'
      responses:
        '200':
          description: The parcel created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parcel'
          links:
            ReadParcel:
              $ref: '#/components/links/ReadParcel'
  /parcels/{parcelId}:
    get:
      operationId: getParcel
      parameters:
        - name: parcelId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The parcel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parcel'
components:
  schemas:
    ParcelInput:
      type: object
      required:
        - destination
      properties:
        destination:
          type: string
        weightGrams:
          type: integer
    Parcel:
      type: object
      required:
        - id
      properties:
        id:
          type: string
        destination:
          type: string
  links:
    ReadParcel:
      operationId: getParcel
      parameters:
        parcelId: $response.body#/id
