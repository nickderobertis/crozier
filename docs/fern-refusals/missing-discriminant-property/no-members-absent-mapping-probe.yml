openapi: 3.0.3
info:
  title: probe
  version: 1.0.0
paths:
  /pets:
    get:
      operationId: getPet
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
components:
  schemas:
    Pet:
      type: object
      properties:
        kind:
          type: string
      discriminator:
        propertyName: kind
        mapping:
          cat: "#/components/schemas/Kitten"
