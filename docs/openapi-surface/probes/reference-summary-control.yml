openapi: 3.1.0
info:
  title: reference-summary-control
  version: 1.0.0
servers:
  - url: https://probe.invalid
paths:
  /probe:
    get:
      operationId: probe
      parameters:
        - $ref: "#/components/parameters/ProbeFilter"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResult"
components:
  parameters:
    ProbeFilter:
      name: probeFilter
      in: query
      required: false
      schema:
        type: string
  schemas:
    ProbeResult:
      title: ProbeResult
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
