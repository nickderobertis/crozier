openapi: 3.0.3
info:
  title: Marina Tides
  version: 1.0.0
paths:
  /tides/{station_id}:
    get:
      operationId: getTides
      tags: [tides]
      parameters:
        - name: station_id
          in: path
          required: true
          schema: {type: string}
        - name: gauges
          in: query
          required: true
          schema:
            description: Gauge numbers to read
            type: array
            items: {type: number}
        - name: since
          in: query
          required: true
          schema:
            anyOf:
              - type: Timestamp
              - type: string
                format: date-time
              - type: number
        - name: step
          in: query
          required: true
          schema: {type: number}
      responses:
        '200':
          description: Readings
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: {type: integer}
  /tides/{station_id}/surge:
    get:
      operationId: getSurge
      tags: [tides]
      parameters:
        - name: station_id
          in: path
          required: true
          schema: {type: string}
        - name: gauges
          in: query
          required: true
          schema:
            type: array
            items: {type: number}
            example: [3, 7]
        - name: since
          in: query
          required: true
          schema:
            anyOf:
              - type: Timestamp
              - type: string
                format: date-time
              - type: number
      responses:
        '200':
          description: Readings
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: {type: integer}
