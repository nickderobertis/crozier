# The `fern-goldens-weekly` Nx project's uv workspace member (the workspace is
# declared in the root pyproject.toml). It publishes nothing: there is no
# [build-system], and `package = false` keeps uv from trying to build or install
# it. Its workspace dependencies are the members whose Python it runs as a copy
# in a scratch root.
[project]
name = "crozier-fern-goldens-weekly"
version = "0.0.0"
description = "The weekly Fern goldens run's journeys, over a bare local remote."
requires-python = ">=3.11"
dependencies = ["crozier-corpus", "crozier-fern-goldens", "crozier-fern-refusals", "crozier-surface-census"]

[tool.uv]
package = false

[tool.uv.sources]
crozier-corpus = { workspace = true }
crozier-fern-goldens = { workspace = true }
crozier-fern-refusals = { workspace = true }
crozier-surface-census = { workspace = true }
