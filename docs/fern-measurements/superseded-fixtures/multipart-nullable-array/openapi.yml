openapi: 3.1.0
info:
  title: Film Archive
  version: 1.0.0
paths:
  /reels:
    post:
      operationId: preserveReel
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                frames:
                  type: array
                  items:
                    type: string
                    format: binary
                    description: Individual photographed frames.
                page:
                  anyOf:
                    - type: string
                      format: binary
                    - type: "null"
      responses:
        "204":
          description: Preserved
  /docks:
    put:
      operationId: updateDocks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Dock"
      responses:
        "204":
          description: Updated
components:
  schemas:
    Dock:
      type: object
      required: [berth]
      properties:
        berth:
          type: integer
        orientation:
          type: string
          enum: [north, south]
