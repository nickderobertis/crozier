openapi: 3.0.3
info:
  title: http-scram-sha-1-beside-bearer
  version: 1.0.0
servers:
  - url: https://probe.invalid
paths:
  /probe:
    get:
      operationId: probe
      security:
        - ProbeScheme: []
        - BearerAuth: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResult"
components:
  schemas:
    ProbeResult:
      title: ProbeResult
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
  securitySchemes:
    ProbeScheme:
      type: http
      scheme: scram-sha-1
    BearerAuth:
      type: http
      scheme: bearer
