openapi: 3.0.3
info:
  title: Organ Workshop
  version: 1.0.0
paths:
  /pipes/{pipeId}:
    patch:
      operationId: tunePipe
      tags: [pipes]
      parameters:
        - name: pipeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pitch:
                  type: string
                  nullable: true
                cents:
                  type: integer
                  nullable: true
      responses:
        "204":
          description: The pipe was tuned.
