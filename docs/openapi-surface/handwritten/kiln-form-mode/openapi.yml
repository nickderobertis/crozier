{
  "openapi": "3.1.0",
  "info": {
    "title": "Kiln Controller",
    "version": "1.0.0"
  },
  "paths": {
    "/token": {
      "post": {
        "requestBody": {
          "required": true,
          "content": {
            "application/x-www-form-urlencoded": {
              "schema": {
                "$ref": "#/components/schemas/TokenBody"
              }
            }
          }
        },
        "responses": {
          "204": {
            "description": "Accepted"
          }
        },
        "operationId": "exchangeToken"
      }
    }
  },
  "components": {
    "schemas": {
      "TokenBody": {
        "type": "object",
        "properties": {
          "grant_type": {
            "type": "string",
            "enum": [
              "authorization_code",
              "refresh_token"
            ]
          },
          "code": {
            "type": "string"
          }
        },
        "required": [
          "grant_type"
        ]
      }
    },
    "responses": {}
  }
}
