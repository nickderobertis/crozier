openapi: 3.0.3
info:
  title: explode-true-simple-path
  version: 1.0.0
servers:
- url: https://probe.invalid
paths:
  /probe/{probeParam}:
    get:
      operationId: probe
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeResult'
      parameters:
      - name: probeParam
        in: path
        required: true
        style: simple
        schema:
          type: string
        explode: true
components:
  schemas:
    ProbeResult:
      type: object
      properties:
        ok:
          type: boolean
      required:
      - ok
