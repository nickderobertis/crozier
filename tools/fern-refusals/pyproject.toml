# The `fern-refusals` Nx project's uv workspace member (the workspace is declared in
# the root pyproject.toml). It publishes nothing: there is no [build-system],
# and `package = false` keeps uv from trying to build or install it.
[project]
name = "crozier-fern-refusals"
version = "0.0.0"
description = "The fern-refusals classes, probes and gate tooling."
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false
